[package]
name = "integration-tests"
default-run = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false


[dependencies]
alloy = { workspace = true, features = ["provider-anvil-api"] }
anyhow.workspace = true
async-process = "2"
async-trait.workspace = true
backon.workspace = true
bollard = "0.21"
borsh.workspace = true
bs58.workspace = true
ciborium.workspace = true
clap.workspace = true
deadpool-redis.workspace = true
futures = "0.3"
hex.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-escape = "0.1.5"
testcontainers = "0.28"
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
url.workspace = true
uuid = { version = "1.0", features = ["v4"] }
sha3.workspace = true
sha2.workspace = true
rlp.workspace = true

# solana dependencies
anchor-client.workspace = true
signet-program.workspace = true
solana-sdk.workspace = true
solana-commitment-config.workspace = true
solana-client.workspace = true
solana-transaction-status.workspace = true

# crypto dependencies
bip32 = { workspace = true, features = ["secp256k1", "std"] }
bip39 = "2.2.0"
ecdsa.workspace = true
cait-sith.workspace = true
elliptic-curve = { version = "0.13.5", default-features = false }
k256.workspace = true

# near dependencies
near-account-id.workspace = true
near-crypto.workspace = true
near-fetch.workspace = true
near-sdk.workspace = true
near-jsonrpc-client.workspace = true
near-primitives.workspace = true
near-workspaces.workspace = true

# local chain-signatures dependencies
mpc-crypto.workspace = true
mpc-compact-hashing.workspace = true
mpc-contract.workspace = true
mpc-chain-integration-core.workspace = true
mpc-chain-canton.workspace = true
mpc-chain-solana.workspace = true
mpc-chain-ethereum = { workspace = true, features = ["contract-test"] }
mpc-chain-hydration.workspace = true
mpc-chain-midnight = { workspace = true, features = ["sandbox"] }
mpc-keys.workspace = true
mpc-node = { workspace = true, features = ["test-feature", "debug-page"] }
mpc-primitives.workspace = true
mpc-utils.workspace = true

[dev-dependencies]
criterion = "0.5.1"
serial_test = "3"
test-log.workspace = true


[[bin]]
name = "integration-tests"
path = "src/main.rs"

[[bin]]
name = "redis-bench"
path = "src/bin/redis_bench.rs"

[[bench]]
name = "sign"
path = "benches/sign.rs"
harness = false

[[bench]]
name = "store"
path = "benches/store.rs"
harness = false

[features]
default = []
