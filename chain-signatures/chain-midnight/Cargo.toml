[package]
name = "mpc-chain-midnight"
edition = "2021"
version.workspace = true
description = "Midnight chain integration for MPC"

[dependencies]
alloy.workspace = true
# TODO: replace with thiserror
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
hex.workspace = true
k256.workspace = true
midnight-base-crypto.workspace = true
midnight-onchain-state.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
mpc-chain-integration-core.workspace = true
mpc-crypto.workspace = true
mpc-primitives.workspace = true
# Crate-local rather than workspace so this manifest states its own features.
# Cargo unifies features across this crate and `node` in a workspace build, so
# nothing here may rely on `unstable-light-client` being absent. Keep the
# version in lockstep with `chain-signatures/node/Cargo.toml`.
subxt = { version = "0.44", default-features = false, features = ["jsonrpsee", "native"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
