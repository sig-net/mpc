[package]
name = "mpc-chain-midnight"
edition = "2021"
version.workspace = true
description = "Midnight chain integration for MPC"

[dependencies]
alloy.workspace = true
# TODO: replace with thiserror
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
hex.workspace = true
k256.workspace = true
midnight-base-crypto.workspace = true
midnight-onchain-state.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
mpc-chain-integration-core.workspace = true
mpc-crypto.workspace = true
mpc-primitives.workspace = true
mpc-utils.workspace = true
serde.workspace = true
serde_json.workspace = true
# Cargo unifies features across this crate and `node` in a workspace build, so
# nothing here may rely on `unstable-light-client` (node's addition) being absent.
subxt = { workspace = true, features = ["jsonrpsee", "native", "reconnecting-rpc-client"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[features]
# Gate for the node-readiness probe integration-tests use to bring up a sandbox.
sandbox = []

[dev-dependencies]
jsonrpsee = { version = "0.24.10", features = ["server"] }
midnight-ledger-v9 = { version = "1.0.0", default-features = false }
midnight-transient-crypto = "3.0.0"
tokio-tungstenite = "0.29"
