[package]
name = "mpc-chain-midnight"
edition = "2021"
version.workspace = true
description = "Midnight chain integration for MPC"

[dependencies]
alloy.workspace = true
# TODO: replace with thiserror
anyhow.workspace = true
async-trait.workspace = true
borsh.workspace = true
futures-util.workspace = true
hex.workspace = true
k256.workspace = true
mpc-chain-integration-core.workspace = true
mpc-crypto.workspace = true
mpc-primitives.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Declared crate-local so this manifest states the features this crate itself
# needs: `cargo build -p mpc-chain-midnight` pulls exactly these. It does NOT keep
# `unstable-light-client` off in a workspace build, where cargo unifies features
# across this crate and `node`, so nothing here may rely on that feature being
# absent. Keep this version in lockstep with `chain-signatures/node/Cargo.toml`;
# the two declarations must move together.
subxt = { version = "0.44", default-features = false, features = ["jsonrpsee", "native"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
mockito.workspace = true
