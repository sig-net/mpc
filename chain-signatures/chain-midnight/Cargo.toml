[package]
name = "mpc-chain-midnight"
edition = "2021"
version.workspace = true
publish.workspace = true
description = "Midnight chain integration for MPC"

[dependencies]
alloy.workspace = true
# TODO: replace with thiserror
anyhow.workspace = true
async-trait.workspace = true
bip32 = { version = "0.5.3", default-features = false, features = ["alloc", "secp256k1"] }
bytes = "1"
futures-util.workspace = true
google-cloud-storage = "=1.17.0"
google-cloud-auth = { version = "1.15", default-features = false, optional = true }
hex.workspace = true
http.workspace = true
# The same crate jsonrpsee's client limits bodies with, to recognise its error.
http-body-util = "0.1"
jsonrpsee = { version = "0.24.10", features = ["http-client"] }
k256.workspace = true
memchr.workspace = true
midnight-base-crypto.workspace = true
midnight-coin-structure = "3.0.0"
# `Transaction` and the call transcripts come from these two crates; nothing in
# the pinned set re-exports them.
midnight-ledger-v9 = { version = "1.0.0", default-features = false }
midnight-onchain-runtime.workspace = true
midnight-onchain-state.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
midnight-transient-crypto.workspace = true
# Proves the DUST spend, whose built-in circuit is zkir v2.
midnight-zkir = "2.2.0"
minocrab-publisher.workspace = true
mpc-chain-integration-core.workspace = true
mpc-tron-wire.workspace = true
mpc-crypto.workspace = true
mpc-compact-hashing.workspace = true
mpc-primitives.workspace = true
mpc-utils.workspace = true
rand.workspace = true
# The indexer subscription's TLS, with its crypto provider named: the graph enables
# two, so rustls has no process default to fall back on.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
subxt = { workspace = true, features = ["native"] }
thiserror.workspace = true
tokio.workspace = true
# The indexer's GraphQL subscription is the only source of the DUST ledger events.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
webpki-roots = "0.26"
tracing.workspace = true
url.workspace = true

[features]
# Gate for the node-readiness probe integration-tests use to bring up a sandbox.
sandbox = ["dep:google-cloud-auth"]

[dev-dependencies]
google-cloud-auth = { version = "1.15", default-features = false }
mockito.workspace = true
jsonrpsee = { version = "0.24.10", features = ["server"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
