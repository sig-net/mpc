# Isolated nested workspace: quarantines the midnight-node-toolkit dependency
# universe (polkadot-sdk / subxt / midnight-ledger) from the main mpc workspace,
# which cannot share a lockfile with it (see MIDNIGHT_PINS.md). Excluded from the
# root workspace; carries its own lockfile and its own ledger [patch.crates-io].
[workspace]

[package]
name = "midnight-publisher"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "midnight-publisher"
path = "src/main.rs"

[dependencies]
# PINNED PAST THE NEWEST RELEASE TAG (node-2.0.0-rc.4), deliberately.
#
# rc.4's key Resolver treats the whole `KeyLocation` as a filename, so a call to
# an ALREADY-DEPLOYED contract — whose location compact-js writes as
# `contract:<addr>/<circuit>?vk=<hash>` — resolves to a path that cannot exist
# and proving dies inside the toolkit ("prover key not created"). Upstream fixed
# it after rc.4 (`parse_contract_key_location` + `resolve_contract_key` in
# ledger/helpers): the location is parsed, the circuit name becomes the file
# stem, and the artifact dir is pinned by matching sha256(<circuit>.verifier)
# against the location's `vk=`. No release carries that fix yet, and `respond`
# IS a call to a deployed contract, so the write path needs this rev.
#
# Safe to take: this rev's `[patch.crates-io]` ledger tags are byte-identical to
# rc.4's (mirrored below), and it is the SAME commit the bundled toolkit-js is
# built from, so both halves of the toolchain stay on one upstream revision.
# Move back to a tag once one ships that contains the resolver fix.
#
# Kept so `cargo build --locked -p midnight-node-toolkit` co-builds the CLI
# from this same seeded lockfile (the binary the service shells out to).
midnight-node-toolkit = { git = "https://github.com/midnightntwrk/midnight-node", rev = "3dc40f2246be424cfcda263c5cf5e2e1de44734d" }
# Ledger-9 type facade (same git+rev as the toolkit, already in the lockfile):
# re-exports ContractState / StateValue / AlignedValue / DefaultDB / deserialize,
# the exact `serialize(&ContractState)` path the toolkit's `contract-state`
# command writes, so `state::decode_contract_state` round-trips the `.mn` bytes.
midnight-node-ledger-helpers = { git = "https://github.com/midnightntwrk/midnight-node", rev = "3dc40f2246be424cfcda263c5cf5e2e1de44734d" }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# Block fetch (Step 1 of GET /block): drive the toolkit's fetcher lib in-process
# to unwrap a finalized block's extrinsics down to ledger `Transaction` bytes.
# `subxt` only names the block-hash type (`subxt::utils::H256`) that
# `fetch_single_block` takes; `tokio` runs that async fetch from the sync
# tiny_http handler. Both crates are already in the lockfile transitively via
# midnight-node-toolkit; default-features = false keeps these edges from adding
# any new features.
subxt = { version = "0.50", default-features = false }
tokio = { version = "1", default-features = false }

[patch.crates-io]
# Replicated from midnight-node @ 3dc40f22 (patches don't propagate transitively).
# Unchanged from node-2.0.0-rc.4: every tag below is byte-identical in both.
midnight-ledger-v9            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.3" }
midnight-zswap                = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zswap-9.0.0-rc.3" }
midnight-coin-structure       = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "coin-structure-3.0.0-rc.1" }
midnight-base-crypto          = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-1.1.0-rc.2" }
midnight-base-crypto-derive   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-derive-1.1.0-rc.2" }
midnight-transient-crypto     = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-3.0.0-rc.2" }
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }
midnight-onchain-vm           = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-vm-4.0.0-rc.2" }
midnight-onchain-state        = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-state-4.0.0-rc.3" }
midnight-onchain-runtime      = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-runtime-4.0.0-rc.2" }
midnight-zkir                 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-2.2.0-rc.3" }
midnight-serialize            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "serialize-1.2.0-rc.1" }
