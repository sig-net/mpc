[package]
name = "mpc-chain-canton"
edition = "2021"
version.workspace = true
description = "Canton chain integration for MPC"

[dependencies]
alloy.workspace = true
alloy-sol-types.workspace = true
# TODO: replace with thiserror
anyhow.workspace = true
async-trait.workspace = true
borsh.workspace = true
futures-util.workspace = true
hex.workspace = true
k256.workspace = true
mpc-chain-integration-core.workspace = true
mpc-crypto.workspace = true
mpc-primitives.workspace = true
oauth2 = { version = "4.4.2", default-features = false, features = ["reqwest"] }
# Pinned to reqwest 0.11 because `oauth2` 4.4.2 hard-pins `reqwest = "0.11"` and we use
# `oauth2::reqwest::async_http_client`. The rest of the workspace is on reqwest 0.12.
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde.workspace = true
serde_json.workspace = true
serde-aux = { version = "4", default-features = false }
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
mockito.workspace = true
