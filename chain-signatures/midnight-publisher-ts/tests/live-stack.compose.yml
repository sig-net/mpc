# The local Midnight stack the live tier runs against: node + indexer + proof
# server, `docker compose -f tests/live-stack.compose.yml up -d`. Copied from
# the midnight-integration stack definition; the three image tags are a
# MATCHED SET on the ledger-9 line, paired with the npm @midnightntwrk/ledger-v9
# version this package pins. Never bump one alone.
services:
  proof-server:
    container_name: 'publisher-live-proof-server'
    image: 'midnightntwrk/proof-server:9.0.0-rc.5_experimental'
    command: ['midnight-proof-server -v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'

  indexer:
    # Pre-alpha tag on purpose: the first published builds that decode
    # MIP-0002 `Misc` events; no stable ledger-9 indexer release exists yet.
    container_name: 'publisher-live-indexer'
    image: 'midnightntwrk/indexer-standalone:4.4.0-pre-alpha.16-l91r3-n2r3-bridge-and-events-epics-contract-zswap-16c656df'
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer_standalone=info,chain_indexer=info,indexer_api=info,info'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      # hex-encoded 32 bytes encrypting stored sensitive data; throwaway on CI
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'dummy-not-using-spo'
    depends_on:
      node:
        condition: service_started

  node:
    container_name: 'publisher-live-node'
    image: 'midnightntwrk/midnight-node:2.0.0-rc.4'
    ports:
      - '127.0.0.1:9944:9944'
    environment:
      CFG_PRESET: 'dev'
      THRESHOLD: '0'
      SHOW_CONFIG: 'false'
      RUST_BACKTRACE: '1'
      # Block-reward beneficiary; arbitrary-but-valid hex on a dev chain.
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
