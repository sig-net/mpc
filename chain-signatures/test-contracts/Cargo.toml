[package]
name = "mpc-test-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"

[dependencies]
borsh = "1.5.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

near-sdk = "5.17.2"

# Need to ignore root workspace
[workspace]
