[package]
name = "mpc-primitives"
version.workspace = true
edition = "2021"
description = "Node-internal primitives for the MPC network (not published; see signet-primitives for the public interface)"
readme = "README.md"
publish = false

[dependencies]
borsh.workspace = true
ciborium.workspace = true
hex.workspace = true
k256.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha3.workspace = true
signet-primitives.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.12", features = ["custom"] }
