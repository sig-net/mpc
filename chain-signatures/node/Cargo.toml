[package]
name = "mpc-node"
version.workspace = true
edition = "2021"

[[bin]]
name = "mpc-node"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum = "0.7.9"
axum-extra = "0.9.6"
backon.workspace = true
chrono = "0.4.24"
dashmap = "6.1"
google-secretmanager1 = "5"
http = "1.1.0"
hyper-rustls = { version = "=0.24", features = ["http2"] }
local-ip-address = "0.5.4"
lru = "0.13.0"
mime = "0.3.17"
prometheus = "0.14.0"
redis = "0.27.2"
sysinfo = "0.32.0"
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing-stackdriver = "0.10.0"
tracing-opentelemetry = "0.30.0"
opentelemetry = { version = "0.29.0", default-features = false, features = [
    "trace",
] }
opentelemetry-otlp = { version = "0.29.0" }
opentelemetry_sdk = { version = "0.29.0", default-features = false, features = [
    "trace",
    "rt-tokio",
] }
opentelemetry-appender-tracing = "0.29.1"
# workspace dependencies
alloy.workspace = true
anyhow.workspace = true
enum-map.workspace = true
borsh.workspace = true
cait-sith.workspace = true
ciborium.workspace = true
clap.workspace = true
deadpool-redis.workspace = true
hex.workspace = true
hyper.workspace = true
k256.workspace = true
rand.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha3.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
futures-util.workspace = true

near-account-id.workspace = true
near-crypto.workspace = true
near-fetch.workspace = true
near-primitives.workspace = true
near-sdk.workspace = true

mpc-contract.workspace = true
mpc-crypto.workspace = true
mpc-chain-integration-core.workspace = true
mpc-chain-canton.workspace = true
mpc-chain-ethereum.workspace = true
mpc-chain-solana.workspace = true
mpc-chain-near.workspace = true
mpc-chain-hydration.workspace = true
mpc-chain-midnight.workspace = true
mpc-compact-hashing.workspace = true
mpc-keys.workspace = true
mpc-primitives.workspace = true
mpc-utils.workspace = true

rlp.workspace = true

maud = { version = "0.27.0", optional = true }
secrecy = "0.10.3"

[dev-dependencies]
mockito.workspace = true
tempfile = "3.27.0"
test-log = { version = "0.2.12", features = ["log", "trace"] }

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[features]
default = []
# utilized for benchmarking the node:
bench = []
# utilized by "integration-tests" package:
test-feature = []
# Show a debug page
debug-page = ["maud"]
# Enable Helios light client for Ethereum
helios = ["mpc-chain-ethereum/helios"]
