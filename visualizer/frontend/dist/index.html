<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPC Sign Request Lifecycle Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f1419;
            color: #e6edf3;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            color: #58a6ff;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #21262d;
        }
        
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: #e6edf3;
        }
        
        .tab.active {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .node-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .node-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #58a6ff;
        }
        
        .request-grid {
            display: grid;
            gap: 12px;
        }
        
        .request-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            transition: border-color 0.2s;
        }
        
        .request-card:hover {
            border-color: #58a6ff;
        }
        
        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .sign-id {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #79c0ff;
        }
        
        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge.sign {
            background: #1f6feb;
            color: #fff;
        }
        
        .badge.sign_bidirectional {
            background: #a371f7;
            color: #fff;
        }
        
        .badge.respond_bidirectional {
            background: #f778ba;
            color: #fff;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-badge.in_posits {
            background: #da3633;
            color: #fff;
        }
        
        .status-badge.generating {
            background: #f0883e;
            color: #fff;
        }
        
        .status-badge.completed {
            background: #3fb950;
            color: #fff;
        }
        
        .request-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #e6edf3;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b949e;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        .error {
            background: #da36334d;
            border: 1px solid #da3633;
            color: #ffa198;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 MPC Sign Request Lifecycle Visualizer</h1>
        
        <div class="tabs">
            <button class="tab active" data-tab="active">Active Requests</button>
            <button class="tab" data-tab="completed">Completed Requests</button>
        </div>
        
        <div id="error-container"></div>
        
        <div id="active-tab" class="tab-content active">
            <div id="active-requests" class="loading">Loading active requests...</div>
        </div>
        
        <div id="completed-tab" class="tab-content">
            <div id="completed-requests" class="loading">Loading completed requests...</div>
        </div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        let currentTab = 'active';
        
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                document.getElementById(`${currentTab}-tab`).classList.add('active');
            });
        });
        
        function formatTime(ms) {
            if (ms < 1000) return `${ms}ms`;
            if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
            return `${(ms / 60000).toFixed(1)}m`;
        }
        
        function renderActiveRequests(data) {
            const container = document.getElementById('active-requests');
            
            if (!data.nodes || data.nodes.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>No nodes found</div></div>';
                return;
            }
            
            const hasActiveRequests = data.nodes.some(node => node.active.length > 0);
            
            if (!hasActiveRequests) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✨</div><div>No active sign requests</div></div>';
                return;
            }
            
            container.innerHTML = data.nodes.map(node => {
                if (node.active.length === 0) return '';
                
                return `
                    <div class="node-section">
                        <div class="node-header">${node.node_id} (${node.active.length} active)</div>
                        <div class="request-grid">
                            ${node.active.map(req => `
                                <div class="request-card">
                                    <div class="request-header">
                                        <span class="sign-id">${req.sign_id}</span>
                                        <div style="display: flex; gap: 8px;">
                                            <span class="badge ${req.sign_request_type}">${req.sign_request_type}</span>
                                            <span class="status-badge ${req.status}">${req.status}</span>
                                        </div>
                                    </div>
                                    <div class="request-stats">
                                        <div class="stat">
                                            <div class="stat-label">Time in Status</div>
                                            <div class="stat-value">${formatTime(req.time_in_status_ms)}</div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Since Last Action</div>
                                            <div class="stat-value">${formatTime(req.time_since_last_action_ms)}</div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Messages Sent</div>
                                            <div class="stat-value">${req.messages_sent}</div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Messages Received</div>
                                            <div class="stat-value">${req.messages_received}</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderCompletedRequests(data) {
            const container = document.getElementById('completed-requests');
            
            if (!data.nodes || data.nodes.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div>No nodes found</div></div>';
                return;
            }
            
            const hasCompletedRequests = data.nodes.some(node => node.completed.length > 0);
            
            if (!hasCompletedRequests) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏳</div><div>No completed sign requests yet</div></div>';
                return;
            }
            
            container.innerHTML = data.nodes.map(node => {
                if (node.completed.length === 0) return '';
                
                return `
                    <div class="node-section">
                        <div class="node-header">${node.node_id} (${node.completed.length} completed)</div>
                        <div class="request-grid">
                            ${node.completed.map(req => `
                                <div class="request-card">
                                    <div class="request-header">
                                        <span class="sign-id">${req.sign_id}</span>
                                        <span class="badge ${req.sign_request_type}">${req.sign_request_type}</span>
                                    </div>
                                    <div class="request-stats">
                                        <div class="stat">
                                            <div class="stat-label">Total Time</div>
                                            <div class="stat-value">${formatTime(req.total_time_ms)}</div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Messages Sent</div>
                                            <div class="stat-value">${req.messages_sent}</div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Messages Received</div>
                                            <div class="stat-value">${req.messages_received}</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function fetchData() {
            try {
                const response = await fetch(`${API_BASE}/api/cluster`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                document.getElementById('error-container').innerHTML = '';
                
                renderActiveRequests(data);
                renderCompletedRequests(data);
            } catch (error) {
                document.getElementById('error-container').innerHTML = `
                    <div class="error">Failed to fetch data: ${error.message}</div>
                `;
            }
        }
        
        // Initial fetch
        fetchData();
        
        // Poll every 500ms
        setInterval(fetchData, 500);
    </script>
</body>
</html>
