# cargo-deny configuration
#
# Replaces .cargo/audit.toml (cargo-audit). cargo-deny resolves the actual
# feature-enabled dependency graph, so lock-only entries from optional feature
# subtrees (libp2p's quic stack, tracing-subscriber 0.2, idna 0.2.3, quinn-proto
# 0.9) are no longer flagged and do not need ignore entries.
#
# `unmaintained` and `unsound` advisories are downgraded to warnings in CI
# (`-W unmaintained -W unsound`), matching the previous cargo-audit behavior
# where they never failed the build. Vulnerabilities always deny.

[graph]
# Match production builds and cover dev-only features in the same pass.
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.23 accepts TLS 1.3 handshake messages across encryption-level boundaries; spec-compliance issue, transcript still authenticated, outgoing client TLS only; 0.23.45 needs aws-lc-rs ^1.18 but near-crypto 0.37.x pins aws-lc-rs =1.16.2 and google-cloud-storage 1.17 forces rustls' aws-lc provider" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.23.x Debug impls for client session values expose TLS secrets; fix 0.23.46 needs aws-lc-rs ^1.18, blocked by near-crypto 0.37.x aws-lc-rs =1.16.2 pin (same chain as RUSTSEC-2026-0285); outgoing client TLS to known endpoints only" },
    { id = "RUSTSEC-2026-0348", reason = "rustls 0.23.x brotli cert decompression can allocate up to 1 GiB before authentication; DoS only, requires malicious TLS server; same aws-lc-rs =1.16.2 blocker as RUSTSEC-2026-0285" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.23.x unauthenticated ServerHello can downgrade later connections to classical key exchange; requires malicious MITM server, we dial known endpoints (GCS, NEAR RPC); same aws-lc-rs =1.16.2 blocker as RUSTSEC-2026-0285" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.103.13 accepts certificate paths through distrusted emSign intermediates; fix 0.103.16 requires aws-lc-rs ^1.18, blocked by near-crypto 0.37.x aws-lc-rs =1.16.2 pin (same chain as RUSTSEC-2026-0285); bundled root stores are emSign-free (webpki-roots/webpki-root-certs 1.0.10 and 0.26.11), platform-verifier paths bypass webpki; residual exposure only via OS trust stores still carrying emSign roots" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 constant-time operations can branch on secret values; required as crypto-bigint 0.5 by elliptic-curve 0.13 (k256, ecdsa, p256, alloy-signer, cait-sith), fix 0.7.6 needs the RustCrypto curve major upgrade tracked in https://github.com/sig-net/mpc/issues/1513" },
]

[licenses]
# Permissive licenses only
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# ck-meow ships a deliberately mangled ("uwuified") MIT license text, pin the file hash to MIT.
[[licenses.clarify]]
name = "ck-meow"
version = "0.1.0"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xe0d600d3 }]

# Ignore private licenses for workspace members and git-pinned crates.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, without a version.
allow-wildcard-paths = true

# A crate declared more than once goes through [workspace.dependencies].
[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
# Fail on any dependency from a registry or git repo not explicitly
# allow-listed below.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/sig-net/cait-sith",
    "https://github.com/sig-net/minocrab",
]
