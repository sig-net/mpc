# cargo-deny configuration
#
# Replaces .cargo/audit.toml (cargo-audit). cargo-deny resolves the actual
# feature-enabled dependency graph, so lock-only entries from optional feature
# subtrees (libp2p's quic stack, tracing-subscriber 0.2, idna 0.2.3, quinn-proto
# 0.9) are no longer flagged and do not need ignore entries.
#
# `unmaintained` and `unsound` advisories are downgraded to warnings in CI
# (`-W unmaintained -W unsound`), matching the previous cargo-audit behavior
# where they never failed the build. Vulnerabilities always deny.

[graph]
# Match production builds and cover dev-only features in the same pass.
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0222", reason = "wasmtime 45 type-index mixup; only reachable via near-sdk unit-testing dev-only feature (near-vm-runner pins wasmtime ^45, no patched release)" },
    { id = "RUSTSEC-2026-0269", reason = "wasmtime 45 filesystem sandbox escape; same chain as RUSTSEC-2026-0222; dev-only, no WASI filesystem exposed to guest code" },
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.23 accepts TLS 1.3 handshake messages across encryption-level boundaries; spec-compliance issue, transcript still authenticated, outgoing client TLS only; 0.23.45 needs aws-lc-rs ^1.18 but near-crypto 0.37.x pins aws-lc-rs =1.16.2 and google-cloud-storage =1.17.0 forces rustls' aws-lc provider" },
    { id = "RUSTSEC-2026-0316", reason = "wasmtime 45 component-model record lifting beyond hostcall fuel; component model is disabled in near-vm-runner 0.37.x (component_model=false, core wasm only), reachable only via near-sdk dev-only unit-testing; no patched 45.x release (fixed in 48.0.3+)" },
    { id = "RUSTSEC-2026-0327", reason = "wasmtime 45 component async-lifted callback count overflow; same reachability as RUSTSEC-2026-0316 (component model disabled, dev-only chain); no patched 45.x release (fixed in 48.0.4+)" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.23.x Debug impls for client session values expose TLS secrets; fix 0.23.46 needs aws-lc-rs ^1.18, blocked by near-crypto 0.37.x aws-lc-rs =1.16.2 pin (same chain as RUSTSEC-2026-0285); outgoing client TLS to known endpoints only" },
    { id = "RUSTSEC-2026-0348", reason = "rustls 0.23.x brotli cert decompression can allocate up to 1 GiB before authentication; DoS only, requires malicious TLS server; same aws-lc-rs =1.16.2 blocker as RUSTSEC-2026-0285" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.23.x unauthenticated ServerHello can downgrade later connections to classical key exchange; requires malicious MITM server, we dial known endpoints (GCS, NEAR RPC); same aws-lc-rs =1.16.2 blocker as RUSTSEC-2026-0285" },
    { id = "RUSTSEC-2026-0359", reason = "wasmtime 45 stack overflow dropping a long chain of recursive types; same dev-only chain as RUSTSEC-2026-0222 (near-sdk unit-testing, wasmtime ^45 pinned by near-vm-runner 0.37.x); no patched 45.x release (fixed in 48.0.6+)" },
    { id = "RUSTSEC-2026-0362", reason = "wasmtime 45 may not enforce async-entrypoint requirement; near-vm-runner 0.37.x uses the sync API only (no async entrypoints); same dev-only chain; no patched 45.x release (fixed in 48.0.6+)" },
    { id = "RUSTSEC-2026-0363", reason = "wasmtime 45 component-model handle tables capped only per instance; component model disabled in near-vm-runner 0.37.x (component_model=false, core wasm only), same dev-only chain; no patched 45.x release (fixed in 48.0.6+)" },
]

[licenses]
# Permissive licenses only
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# ck-meow ships a deliberately mangled ("uwuified") MIT license text, pin the file hash to MIT.
[[licenses.clarify]]
name = "ck-meow"
version = "0.1.0"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xe0d600d3 }]

# Ignore private licenses for workspace members and git-pinned crates.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Fail on any dependency from a registry or git repo not explicitly
# allow-listed below.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/midnightntwrk/midnight-ledger",
    "https://github.com/sig-net/cait-sith",
    "https://github.com/sig-net/minocrab",
]
