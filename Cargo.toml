[workspace]
members = [
    "chain-signatures/crypto",
    "chain-signatures/contract",
    "chain-signatures/contract-sol",
    "chain-signatures/keys",
    "chain-signatures/node",
    "chain-signatures/primitives",
    "signet-crypto",
    "signet-primitives",
    "integration-tests", 
    "chain-signatures/chain-integration-core", 
    "chain-signatures/chain-canton", 
    "chain-signatures/chain-solana",
    "chain-signatures/chain-ethereum",
    "chain-signatures/chain-near",
    "chain-signatures/chain-midnight",
    "chain-signatures/utils",
]
exclude = ["infra/scripts/generate_keys"]
resolver = "2"

[workspace.package]
version = "1.17.0"

[workspace.dependencies]
alloy = { version = "=1.0.38", features = ["contract", "json"] }
anyhow = { version = "1.0.95", features = ["backtrace"] }
async-trait = "0.1"
backon = "0.4"
borsh = { version = "1.6.1", features = ["derive"] }
enum-map = "2.7.3"
cait-sith = { git = "https://github.com/sig-net/cait-sith", rev = "9f34e8c", features = ["k256"] }
ciborium = "0.2.2"
clap = { version = "4.5.4", features = ["derive", "env"] }
deadpool-redis = "0.18.0"
hex = "0.4.3"
hkdf = "0.12.4"
hyper = { version = "0.14", features = ["full"] }
k256 = { version = "0.13.1", features = [
    "sha256",
    "ecdsa",
    "serde",
    "arithmetic",
    "expose-field",
] }
mockito = "1.7.0"
rand = "0.8.5"
reqwest = { version = "0.11.16", features = ["blocking", "json"] }
semver = "1.0.23"
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11.15"
serde_json = "1"
sha3 = "0.10.8"
subxt = { version = "0.44", default-features = false }
thiserror = "1"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7.16", default-features = false }
tracing = "0.1.35"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "env-filter",
    "registry",
    "std",
    "fmt",
] }
url = { version = "2.4.0", features = ["serde"] }
wasmtimer = "0.4.3"
anchor-client = { version = "0.31.0", features = ["async"] }
anchor-lang = "0.31.0"
solana-sdk = "2.3.1"
solana-transaction-status = "2.3.13"
secp256k1 = "0.28.2"
rlp = "0.5"
solana-client = "2.3.13"
futures-util = "0.3.31"
parity-scale-codec = { version = "3", features = ["derive"] }

near-account-id = "2.6.0"
near-crypto = "0.37"
near-fetch = "0.12.0"
near-primitives = "0.37"
near-jsonrpc-client = "0.22"
near-sdk = { version = "5.29.0", features = ["unstable", "non-contract-usage"] }
near-workspaces = "0.23.0"

memchr = "2"
midnight-base-crypto = "1.1.0"
midnight-onchain-runtime = "4.0.0"
midnight-onchain-state = "4.0.0"
midnight-serialize = "1.2.0"
midnight-storage = "2.0.1"

mpc-contract = { path = "./chain-signatures/contract" }
mpc-crypto = { path = "./chain-signatures/crypto" }
mpc-chain-integration-core = { path = "./chain-signatures/chain-integration-core" }
mpc-chain-canton = { path = "./chain-signatures/chain-canton" }
mpc-chain-ethereum = { path = "./chain-signatures/chain-ethereum" }
mpc-chain-solana = { path = "./chain-signatures/chain-solana" }
mpc-chain-near = { path = "./chain-signatures/chain-near" }
mpc-chain-midnight = { path = "./chain-signatures/chain-midnight" }
mpc-keys = { path = "./chain-signatures/keys" }
mpc-utils = { path = "./chain-signatures/utils" }
mpc-node = { path = "./chain-signatures/node" }
mpc-primitives = { path = "./chain-signatures/primitives" }
signet-crypto = { path = "./signet-crypto" }
signet-midnight-serde = "=0.1.0"
signet-primitives = { path = "./signet-primitives" }
signet-program = { path = "./chain-signatures/contract-sol" }

[patch.crates-io]
# TODO: trigger Cargo.lock update for x25519-dalek once they release.
# This fixes https://rustsec.org/advisories/RUSTSEC-2024-0344 by pointing to a commit that includes the fix.
# This fix has yet to be propagated to crates.io so we will patch it instead.
x25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", rev = "5b7082bbc8e0b2106ab0d956064f61fa0f393cdc" }

# The prerelease ledger crates are not on crates.io, so each is patched to its
# git tag, using the tags the midnight-node repo pins. Per-crate TAGS, not one
# branch: the graph carries two lines of midnight-transient-crypto at once, and
# a single branch can only supply one of them, so each entry pins the tag its
# line asks for. Only entries the crate graph resolves are kept; cargo warns on
# every unused patch.
midnight-coin-structure       = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "coin-structure-3.0.0-rc.1" }
midnight-base-crypto          = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-1.1.0-rc.2" }
midnight-base-crypto-derive   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "base-crypto-derive-1.1.0-rc.2" }
midnight-transient-crypto     = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-3.0.0-rc.2" }
midnight-transient-crypto-old = { package = "midnight-transient-crypto", git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }
midnight-onchain-state        = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-state-4.0.0-rc.3" }
midnight-serialize            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "serialize-1.2.0-rc.1" }
midnight-ledger-v9            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "crate-ledger-9.1.0.0-rc.3" }
midnight-zswap                = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zswap-9.0.0-rc.3" }
midnight-onchain-vm           = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-vm-4.0.0-rc.2" }
midnight-onchain-runtime      = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "onchain-runtime-4.0.0-rc.2" }
midnight-zkir                 = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "zkir-2.2.0-rc.3" }


# big optimization even in test builds for math heavy crates
[profile.dev.package.curve25519-dalek]
opt-level = 3

# Disable debug symbols in all profiles to reduce binary size
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.fixture]
inherits = "release"
debug = 0

[profile.cluster]
inherits = "release"
debug = 0

[profile.release]
debug = 0
