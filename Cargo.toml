[workspace]
members = [
    "chain-signatures/crypto",
    "chain-signatures/contract",
    "chain-signatures/contract-sol",
    "chain-signatures/keys",
    "chain-signatures/node",
    "chain-signatures/primitives",
    "signet-crypto",
    "signet-primitives",
    "integration-tests", 
    "chain-signatures/chain-integration-core", 
    "chain-signatures/chain-canton", 
    "chain-signatures/chain-solana",
    "chain-signatures/chain-ethereum",
    "chain-signatures/chain-near",
    "chain-signatures/chain-hydration",
    "chain-signatures/chain-midnight",
"chain-signatures/chain-tron",
    "chain-signatures/tron-wire",
    "chain-signatures/compact-hashing",
    "chain-signatures/midnight-respond-codec",
    "chain-signatures/utils",
]
# What a bare `cargo build` or `cargo test` covers: every member but
# `integration-tests`. That crate asks for the node's `test-feature`, and cargo
# turns a feature on for every package built in the same run, so building it
# next to the node would produce a node binary with test code and test cadences.
# A new member goes in both lists.
default-members = [
    "chain-signatures/crypto",
    "chain-signatures/contract",
    "chain-signatures/contract-sol",
    "chain-signatures/keys",
    "chain-signatures/node",
    "chain-signatures/primitives",
    "signet-crypto",
    "signet-primitives",
    "chain-signatures/chain-integration-core",
    "chain-signatures/chain-canton",
    "chain-signatures/chain-solana",
    "chain-signatures/chain-ethereum",
    "chain-signatures/chain-near",
    "chain-signatures/chain-hydration",
    "chain-signatures/chain-midnight",
    "chain-signatures/chain-tron",
    "chain-signatures/tron-wire",
    "chain-signatures/compact-hashing",
    "chain-signatures/midnight-respond-codec",
    "chain-signatures/utils",
]
resolver = "2"

[workspace.package]
version = "1.22.0"
publish = false

[workspace.dependencies]
alloy = { version = "=1.0.38", features = ["contract", "json"] }
anyhow = { version = "1.0.95", features = ["backtrace"] }
async-trait = "0.1"
backon = "0.4"
borsh = { version = "1.6.1", features = ["derive"] }
enum-map = "2.7.3"
http = "1.5"
cait-sith = { git = "https://github.com/sig-net/cait-sith", rev = "9f34e8c", features = ["k256"] }
ciborium = "0.2.2"
clap = { version = "4.5.4", features = ["derive", "env"] }
deadpool-redis = "0.18.0"
hex = "0.4.3"
hkdf = "0.12.4"
k256 = { version = "0.13.1", features = [
    "sha256",
    "ecdsa",
    "serde",
    "arithmetic",
    "expose-field",
] }
mockito = "1.7.0"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
semver = "1.0.23"
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11.15"
serde_json = "1"
sha3 = "0.10.8"
subxt = { version = "0.44", default-features = false }
thiserror = "1"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7.16", default-features = false }
tracing = "0.1.35"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "env-filter",
    "registry",
    "std",
    "fmt",
] }
url = { version = "2.4.0", features = ["serde"] }
anchor-client = { version = "1.2.0", features = ["async"] }
anchor-lang = "1.2.0"
solana-sdk = "3.0.0"
solana-commitment-config = "3.1.1"
solana-transaction-status = "3.1.14"
rlp = "0.5"
solana-client = "3.1.14"
futures-util = "0.3.31"

near-account-id = "2.6.0"
near-crypto = "0.37"
near-fetch = "0.12.0"
near-primitives = "0.37"
near-jsonrpc-client = { version = "0.22", default-features = false, features = [
    "rustls-tls",
] }
near-sdk = { version = "5.29.0", features = ["unstable", "non-contract-usage"] }
near-workspaces = "0.23.0"

memchr = "2"
midnight-base-crypto = "1.1.1"
midnight-onchain-runtime = "4.0.1"
midnight-onchain-state = "4.0.1"
midnight-serialize = "1.2.1"
midnight-storage = "3.0.0"
midnight-transient-crypto = "3.0.1"
# The respond-intent builder and in-process prover for the signet responder.
minocrab-publisher = { git = "https://github.com/sig-net/minocrab", rev = "b41babe6a49be2a07e3edc7c3eaca590a2bb5409" }

mpc-contract = { path = "./chain-signatures/contract" }
mpc-crypto = { path = "./chain-signatures/crypto" }
mpc-chain-integration-core = { path = "./chain-signatures/chain-integration-core" }
mpc-chain-canton = { path = "./chain-signatures/chain-canton" }
mpc-chain-ethereum = { path = "./chain-signatures/chain-ethereum" }
mpc-chain-solana = { path = "./chain-signatures/chain-solana" }
mpc-chain-near = { path = "./chain-signatures/chain-near" }
mpc-chain-hydration = { path = "./chain-signatures/chain-hydration" }
mpc-chain-midnight = { path = "./chain-signatures/chain-midnight" }
mpc-chain-tron = { path = "./chain-signatures/chain-tron" }
mpc-tron-wire = { path = "./chain-signatures/tron-wire" }
mpc-compact-hashing = { path = "./chain-signatures/compact-hashing" }
mpc-midnight-respond-codec = { path = "./chain-signatures/midnight-respond-codec" }
mpc-keys = { path = "./chain-signatures/keys" }
mpc-utils = { path = "./chain-signatures/utils" }
mpc-node = { path = "./chain-signatures/node" }
mpc-primitives = { path = "./chain-signatures/primitives" }
signet-crypto = { path = "./signet-crypto" }
signet-midnight-serde = "=0.24.0"
signet-primitives = { path = "./signet-primitives" }
signet-program = { path = "./chain-signatures/contract-sol" }

# big optimization even in test builds for math heavy crates
[profile.dev.package.curve25519-dalek]
opt-level = 3

# Disable debug symbols in all profiles to reduce binary size
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.fixture]
inherits = "release"
debug = 0

[profile.cluster]
inherits = "release"
debug = 0

[profile.release]
debug = 0
