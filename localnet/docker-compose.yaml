# A local MPC network you can point a client at.
#
#   docker compose -f localnet/docker-compose.yaml up -d
#
# Two services. `mpc-localnet` is the whole MPC network in one container: Redis, a NEAR
# sandbox, the bootstrap that prepares both chains, and three MPC nodes. `surfpool` is the
# Solana chain that signature requests arrive on, kept separate because it is the piece a
# consumer is most likely to already run or to want to share.
#
# See localnet/README.md for what to expect and how to submit a signature request.

name: mpc-localnet

services:
  # Where signature requests come from. Surfpool is a drop-in for solana-test-validator that
  # publishes a native arm64 image, and its surfnet_writeProgram cheat code lets the
  # bootstrap install the signet program without the Solana CLI or a deploy.
  #
  # --offline keeps it from reaching for a remote datasource, so the stack stays hermetic.
  # The image ships its own healthcheck, so none is declared here.
  surfpool:
    image: surfpool/surfpool@sha256:4f7b64daa96ab42d8a0d46cd0de556b1c90386f56fd66cfdefcb5f7039fdec9f
    command: ["start", "--no-tui", "--no-studio", "--offline", "--host", "0.0.0.0"]
    ports:
      - "8899:8899"
      - "8900:8900"

  # The MPC network. Everything it needs is baked into the image, including the key material,
  # so there is nothing to mount and nothing to prepare.
  #
  # Healthy means the three nodes report `running`. It does not mean they will answer you:
  # serving starts roughly 25 seconds after that, so clients must retry. See the README.
  mpc-localnet:
    build:
      context: ..
      dockerfile: localnet/Dockerfile
    image: sig-net/mpc-localnet:dev
    ports:
      - "3000:3000" # mpc node 0
      - "3001:3001" # mpc node 1
      - "3002:3002" # mpc node 2
      - "3030:3030" # near rpc
      - "6379:6379" # redis
    environment:
      LOCALNET_SOLANA_RPC: "${LOCALNET_SOLANA_RPC:-http://surfpool:8899}"
      LOCALNET_SOLANA_WS: "${LOCALNET_SOLANA_WS:-ws://surfpool:8900}"
      # false has the cluster generate its own triples and presignatures the way a deployed
      # network does. It costs nothing measurable here, see localnet/README.md.
      LOCALNET_STOCKPILE: "${LOCALNET_STOCKPILE:-true}"
      RUST_LOG: "${RUST_LOG:-mpc_node=info,mpc_node::indexer_sol=debug}"
    depends_on:
      surfpool:
        condition: service_healthy

  # Submits a signature request and waits for the cluster to answer. Not started by `up`;
  # run it on demand:
  #
  #   docker compose -f localnet/docker-compose.yaml --profile tools run --rm signer sign --path test
  #
  # Same image as the cluster, so this triggers no second build.
  signer:
    profiles: ["tools"]
    image: sig-net/mpc-localnet:dev
    entrypoint: ["mpc-localnet"]
    command: ["sign", "--path", "test"]
    environment:
      LOCALNET_SOLANA_RPC: "${LOCALNET_SOLANA_RPC:-http://surfpool:8899}"
      RUST_LOG: mpc_localnet=info
