name: Deploy Multichain Prod.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      network:
        type: choice
        options:
          - mainnet
          - testnet
        description: mainnet or testnet network
        default: testnet
        required: true

env:
  TAG: ${{ github.sha }}


jobs:
  # Prod releases are cut from tags only. The "Run workflow" dialog also offers
  # branches, so refuse to build unless the selected ref is a tag.
  require-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from a branch
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Prod releases must be run from a tag, not a branch (got ${{ github.ref }})."
          exit 1

  build-mpc-recovery:
    needs: require-tag
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        name: "Checkout mpc-recovery"

      - name: Login to GCP Artifact Registry Mainnet
        if: github.event.inputs.network == 'mainnet'
        run: echo "$GOOGLE_CREDENTIALS" | docker login -u _json_key --password-stdin https://europe-west1-docker.pkg.dev
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.SIG_CREDENTIALS_MAINNET }}

      - name: Login to GCP Artifact Registry Testnet
        if: github.event.inputs.network == 'testnet'
        run: echo "$GOOGLE_CREDENTIALS" | docker login -u _json_key --password-stdin https://europe-west1-docker.pkg.dev
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.SIG_CREDENTIALS_TESTNET }}

        # Since the Mainnet and Testnet nodes are polling this image repository, only the image needs to be updated in order to trigger a deployment
      - name: Build Docker image and deploy partner nodes
        id: docker-push-tagged-partner
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          push: true
          file: ./Dockerfile
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
          tags: "europe-west1-docker.pkg.dev/near-cs-${{ github.event.inputs.network }}/multichain-public/multichain-${{ github.event.inputs.network }}:latest,europe-west1-docker.pkg.dev/near-cs-${{ github.event.inputs.network }}/multichain-public/multichain-${{ github.event.inputs.network }}:${{ env.TAG }}"
