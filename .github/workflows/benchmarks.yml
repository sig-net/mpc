name: Benchmarks

on:
  pull_request:
    types:
      - opened
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  sign-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Install Rust (1.81.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.81.0
          target: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark

      - name: Fetch dependencies
        run: cargo fetch

      - name: Run sign benchmark
        env:
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail
          cargo bench -p integration-tests --bench sign -- --noplot | tee bench.log

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-bench-log
          path: bench.log
          retention-days: 7

      - name: Append results to job summary
        if: always()
        run: |
          {
            echo '## Benchmark Results';
            if [ -f bench.log ]; then
              tail -n 200 bench.log;
            else
              echo 'bench.log missing';
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment benchmark results on PR
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const logPath = 'bench.log';
            let logSnippet = 'bench.log not found.';
            if (fs.existsSync(logPath)) {
              const lines = fs.readFileSync(logPath, 'utf8').trim().split('\n');
              const tail = lines.slice(-200);
              logSnippet = tail.length ? tail.join('\n') : 'Log file was empty.';
            }

            const prNumber = context.payload.pull_request?.number
              || (context.payload.inputs?.pr_number ? Number(context.payload.inputs.pr_number) : undefined);
            if (!prNumber) {
              core.info('No PR number available; skipping PR comment.');
              return;
            }

            const body = [
              '## Benchmark Results',
              '',
              '```',
              logSnippet,
              '```',
              '',
              `_Workflow run: ${context.runNumber}_`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
