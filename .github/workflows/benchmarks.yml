name: Benchmarks

on:
  pull_request:
    types:
      - opened
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to comment on"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  sign-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Install Rust (1.81.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.81.0
          target: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark

      - name: Fetch dependencies
        run: cargo fetch

      - name: Run sign benchmark
        env:
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail
          cargo bench -p integration-tests --bench sign -- --noplot --output-format bencher > benchmark-output.txt

      - name: Report benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: integration-tests sign
          tool: cargo
          output-file-path: benchmark-output.txt
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          auto-push: false
          comment-always: true
          comment-on-alert: true
          alert-threshold: '110%'
          fail-on-alert: false

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-benchmark-raw
          path: benchmark-output.txt
          retention-days: 7
