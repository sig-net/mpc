name: Unit
on:
  pull_request:
  merge_group:

env:
  RUSTFLAGS: -D warnings
jobs:
  changes:
    uses: ./.github/workflows/_ci-changes.yml

  test:
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: warp-ubuntu-latest-x64-4x
    name: Check & Test
    steps:
      - uses: actions/checkout@v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          target: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit-test
          cache-targets: true
          cache-on-failure: false
          # Prevent every PR from uploading multi-GB caches
          save-if: ${{ github.event_name == 'merge_group' }}
      
      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      - name: Compile Contract
        run: just build contract
      - name: Compile eth contract
        run: just build eth
      
      - name: Eth contract unit tests
        run: just test-eth-unit
      
      - name: Test format
        run: just fmt-check
      
      - name: Test clippy
        run: just lint
      
      - name: Unit tests
        run: just test-unit

  audit:
    needs: [changes]
    if: needs.changes.outputs.audit == 'true'
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0

      # Run cargo-audit to check for vulnerable dependencies
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
