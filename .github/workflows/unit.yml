name: Unit
on:
  pull_request:
  merge_group:
  # Cache policy: docs/ci-caching.md
  push:
    branches: [develop]
    paths: [Cargo.lock, "**/Cargo.toml", ".cargo/**", "deny.toml", "rust-toolchain*", .github/workflows/unit.yml]
  workflow_dispatch:

env:
  RUSTFLAGS: -D warnings
jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-4x
    name: Check & Test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust (1.93.0)
        uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json

      - name: Detect dependency changes vs develop
        id: depchange
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin develop
          git diff --name-only FETCH_HEAD...HEAD |
            grep -qE '(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?)$|^\.cargo/|^\.github/workflows/' &&
            echo changed=true >> "$GITHUB_OUTPUT" || true

      # Cache policy: doc/ci-caching.md
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-dev
          cache-targets: true
          cache-on-failure: false
          # Only save the cache if there are dependency changes or it's not a merge group
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.depchange.outputs.changed == 'true') }}
      
      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      - name: Compile Contract
        run: just build contract
      - name: Compile eth contract
        run: just build eth
      
      - name: Eth contract unit tests
        run: just test-eth-unit
      
      - name: Test format
        run: just fmt-check
      
      - name: Test clippy
        run: just lint
      
      - name: Unit tests
        run: just test-unit

      - name: Midnight output storage tests
        run: cargo test -p mpc-chain-midnight --lib --features sandbox output_storage::tests

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          toolchain: 1.93.0

      # Check the feature-resolved dependency graph: security advisories
      # (vulnerabilities deny; `unmaintained`/`unsound` downgraded to warnings to
      # match the previous cargo-audit behavior), license compliance, dependency
      # bans, and source allow-listing.
      - name: Check dependencies (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources -W unmaintained -W unsound --hide-inclusion-graph
