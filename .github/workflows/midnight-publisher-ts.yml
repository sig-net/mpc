# The midnight publisher's offline gate: typecheck, the full vitest suite, and
# the Rust consumer driving this service over real HTTP. All of it stack-free by
# design (pure codecs against checked-in fixtures, stubbed write-path
# orchestration).
#
# The live end-to-end path (boot the dockerized stack, deploy a singleton,
# prove/balance/submit, confirm on chain) is deliberately NOT automated here.
# It is run on demand from `tests/respond-live.ts`, which carries the runbook.
# That exclusion is about the CHAIN, not about mocking: the sidecar contract
# tests below boot this service for real and speak HTTP to it, and still need no
# node, no proof server, no indexer and no wallet.
#
# The filters cover BOTH packages, because those tests exist to catch drift
# between the two languages and so have to run when either side moves.
name: midnight-publisher-ts

on:
  pull_request:
    paths:
      - ".github/workflows/midnight-publisher-ts.yml"
      - "chain-signatures/midnight-publisher-ts/**"
      - "chain-signatures/chain-midnight/**"
  push:
    branches: [develop]
    paths:
      - ".github/workflows/midnight-publisher-ts.yml"
      - "chain-signatures/midnight-publisher-ts/**"
      - "chain-signatures/chain-midnight/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain-signatures/midnight-publisher-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chain-signatures/midnight-publisher-ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

      # `chain-midnight`'s sidecar client against THIS service:
      # `tests/sidecar_live.rs` boots `tests/serve-decode-only.ts` on a free
      # loopback port and drives the decode routes with the captured chain blobs
      # in `tests/fixtures`, so neither half of the contract is authored by the
      # side it is checked against. About three seconds, and no stack.
      #
      # Those tests are `#[ignore]`d in the crate, so `unit.yml`'s `cargo test`
      # reports them as ignored and this is the only place they actually run.
      # They come after `npm ci` because they spawn the service out of this
      # package's own installed dependencies, and last because everything above
      # is cheaper to fail on.

      # Copied from `unit.yml`, including the version. Note that this installs the
      # toolchain without making it the default (`actions-rs/toolchain` defaults
      # `default` and `override` to false), so cargo below runs the runner's own
      # stable, exactly as every other Rust job in this repo does.
      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0

      # reqwest reaches OpenSSL through native-tls on Linux; use the system one
      # rather than building it from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: midnight-sidecar-test
          cache-targets: true
          cache-on-failure: false
          # Prevent every PR from uploading multi-GB caches
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # From the workspace root: this job's default working directory is the
      # publisher package, which is not a cargo package.
      - name: Sidecar contract tests
        working-directory: ${{ github.workspace }}
        run: cargo test -p mpc-chain-midnight --test sidecar_live -- --ignored
