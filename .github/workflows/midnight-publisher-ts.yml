# The midnight intent builder's gate. The TypeScript package builds intents and
# submits them through a funding wallet. Its deterministic suite runs the real
# circuit and local HTTP boundary without requiring a full Midnight stack.
#
# The Rust half of the seam (`chain-midnight`'s IntentGen spawning `dist/main.js`)
# runs here too: the `intent_seam` differential drives the freshly built entry point
# with the real client, which is what catches the two sides drifting apart, and is
# why the `chain-midnight` path filter below is among the triggers.
#
# The required live end-to-end path runs in the Integration workflow's
# Midnight Real Stack job; this workflow keeps the package and Rust seam fast.
name: Midnight Publisher TS

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/midnight-publisher-ts.yml"
      - "Dockerfile"
      - "chain-signatures/midnight-publisher-ts/**"
      - "chain-signatures/chain-midnight/**"
  pull_request:
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain-signatures/midnight-publisher-ts
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: chain-signatures/midnight-publisher-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      # `dist/main.js` is what the Rust client spawns, and `tsconfig.json` sets
      # `noEmit`, so the build config is the only thing that produces it.
      - name: Build TypeScript publisher
        run: npm run build

      - name: Run TypeScript tests
        run: npx vitest run

      - name: Production publisher image smoke
        working-directory: .
        run: docker build --target midnight-publisher-runtime .

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: midnight-seam
          cache-targets: true
          cache-on-failure: false
          # Prevent every PR from uploading multi-GB caches
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # The filter names the test binary: the seam tests live in
      # `tests/intent_seam.rs` and are `#[ignore]`d, so `--run-ignored all` plus
      # `binary(intent_seam)` runs exactly them, while a `test(intent_seam)` filter
      # matches against test names and selects nothing.
      - name: Rust intent seam differential
        working-directory: .
        run: cargo nextest run -p mpc-chain-midnight --run-ignored all -E 'binary(intent_seam)'
