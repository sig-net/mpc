# The midnight publisher's gate. The TypeScript package builds intents and
# submits them through a funding wallet. Its deterministic suite runs the real
# circuit and local HTTP boundary without requiring a full Midnight stack.
#
# The Rust half of the seam (`chain-midnight`'s IntentGen spawning `dist/main.js`)
# runs here too: the `intent_seam` differential drives the freshly built entry point
# with the real client, which is what catches the two sides drifting apart.
#
# The required live end-to-end path runs in the Integration workflow's
# Midnight Real Stack job; this workflow keeps the package and Rust seam fast.
name: Midnight Publisher TS

on:
  pull_request:
  merge_group:

jobs:
  test:
    name: Midnight Publisher TS Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chain-signatures/midnight-publisher-ts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: chain-signatures/midnight-publisher-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint TypeScript
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      # `npm test` runs the package's pretest build because the child-process
      # tests execute the emitted `dist/main.js` entry point.
      - name: Build and test TypeScript publisher
        run: npm test

      - name: Production publisher image smoke
        working-directory: .
        run: docker build --target midnight-publisher-runtime .

      - name: Install Rust (1.93.0)
        uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          toolchain: 1.93.0

      - name: Detect dependency changes vs develop
        id: depchange
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin develop
          git diff --name-only FETCH_HEAD...HEAD |
            grep -qE '(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?)$|^\.cargo/|^\.github/workflows/' &&
            echo changed=true >> "$GITHUB_OUTPUT" || true

      # Cache policy: doc/ci-caching.md
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-dev
          cache-targets: true
          cache-on-failure: false
          # Only save the cache if there are dependency changes or it's not a merge group
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.depchange.outputs.changed == 'true') }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e88e69ecdb9658bd172693dcdc2c84e7f0ab6a11 # nextest
        with:
          tool: nextest
      # The filter names the test binary: the seam tests live in
      # `tests/intent_seam.rs` and are `#[ignore]`d, so `--run-ignored all` plus
      # `binary(intent_seam)` runs exactly them, while a `test(intent_seam)` filter
      # matches against test names and selects nothing.
      - name: Rust intent seam differential
        working-directory: .
        run: just test-midnight-seam
