name: Canton Integration Tests

on:
  pull_request:
  merge_group:

env:
  RUSTFLAGS: -D warnings

jobs:
  canton:
    name: Canton ${{ matrix.suite.name }} Tests
    runs-on: warp-ubuntu-latest-x64-4x
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Stream
            filter: canton_stream
          - name: E2E
            filter: cases::canton

    steps:
      - uses: actions/checkout@v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the images in parallel. The images are used in Canton test harness
      - name: Pull Redis and Foundry images
        run: |
          printf '%s\n' redis:7.4.2 ghcr.io/foundry-rs/foundry:nightly \
            | xargs -P "$(nproc)" -n 1 docker pull

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dpm (Canton CLI)
        run: |
          curl -fsSL https://get.digitalasset.com/install/install.sh | sh
          echo "$HOME/.dpm/bin" >> $GITHUB_PATH
          export PATH="$HOME/.dpm/bin:$PATH"
          # Pin the SDK (the harness uses the globally active one; the installer defaults to latest).
          dpm install 3.5.1
          dpm --version

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          target: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache policy: docs/ci-caching.md
          shared-key: workspace-full
          cache-targets: true
          cache-on-failure: false

      - name: Build eth contract
        run: just build eth

      - name: Build integration tests
        run: just build tests

      - name: Run Canton ${{ matrix.suite.name }} tests
        run: just test-canton ${{ matrix.suite.filter }}
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1
