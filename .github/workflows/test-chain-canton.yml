name: Canton Tests

# On demand only: the Canton suites need a dpm + JDK toolchain and a full
# integration build per job, which is costly to repeat on every PR. Canton code
# is still compiled and linted by `just lint` and unit-tested by `just test-unit`
# in the Unit Tests workflow. Run this from the Actions tab for Canton changes.
on:
  workflow_dispatch:

env:
  RUSTFLAGS: -D warnings

# Cancel superseded runs of the same PR. Merge-queue and develop runs keep going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  canton:
    name: Canton ${{ matrix.suite.name }} Tests
    runs-on: warp-ubuntu-latest-x64-4x
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Stream
            filter: canton_stream
          - name: E2E
            filter: cases::canton

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install just
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.54.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.13'

      # Same steps as get.digitalasset.com/install/install.sh, with the
      # tarball checked against a pinned hash before it runs.
      - name: Install dpm (Canton CLI)
        env:
          DPM_VERSION: 3.6.4
          DPM_SHA256: c31a89057ab950d4fafa53d19d12874032f5801ea82e6fa67056c223a0e2d6c8
          DPM_REGISTRY: https://artifactregistry.googleapis.com/download/v1/projects/da-images/locations/europe/repositories/public-generic/files
        run: |
          tarball="dpm-$DPM_VERSION-linux-amd64.tar.gz"
          curl -fsSL --retry 4 -o "/tmp/$tarball" \
            "$DPM_REGISTRY/dpm-sdk:$DPM_VERSION:$tarball:download?alt=media"
          echo "$DPM_SHA256  /tmp/$tarball" | sha256sum -c
          mkdir -p /tmp/dpm
          tar xzf "/tmp/$tarball" -C /tmp/dpm --strip-components 1
          /tmp/dpm/bin/dpm bootstrap /tmp/dpm
          echo "$HOME/.dpm/bin" >> $GITHUB_PATH
          export PATH="$HOME/.dpm/bin:$PATH"
          # Pin the SDK (the harness uses the globally active one; the installer defaults to latest).
          dpm install 3.5.1
          dpm --version

      - name: Install Rust (1.100.0)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json

      - name: Install cargo-near
        run: scripts/install-cargo-near.sh

      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV
 
      - name: Detect dependency changes vs develop
        id: depchange
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin develop
          # Two trees, no merge base: the shallow checkout has no common history.
          files=$(git diff --name-only FETCH_HEAD HEAD)
          if grep -qE '(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?)$|^\.cargo/|^\.github/workflows/' <<< "$files"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

      # Cache policy: doc/ci-caching.md
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-full
          cache-targets: true
          cache-on-failure: false
          # Only save the cache if there are dependency changes or it's not a merge group
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.depchange.outputs.changed == 'true') }}

      - name: Build eth contract
        run: just build eth

      - name: Build integration tests
        run: just build tests

      - name: Run Canton ${{ matrix.suite.name }} tests
        run: just test-canton ${{ matrix.suite.filter }}
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1
