name: Integration

on:
  push:
    branches:
      - develop
    paths:
      - integration-tests/**
      - chain-signatures/**
  pull_request:
  merge_group:

env:
  RUSTFLAGS: -D warnings
jobs:
  # Fixture tests: in-process MPC protocol tests, no Docker or external infra needed.
  # Runs the `fixture` nextest profile (see .config/nextest.toml).
  fixture-test:
    name: Fixture Test
    runs-on: warp-ubuntu-latest-x64-4x

    steps:
      - name: Comment on PR if this is a re-run
        if: github.run_attempt > 1 && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `⚠️ Component tests (MPC fixture) were re-run (attempt ${process.env.RUN_ATTEMPT})`,
            });

      - uses: actions/checkout@v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Relayer, Sandbox, Redis Docker Images
        run: |
          docker pull redis:7.4.2

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          target: wasm32-unknown-unknown

      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fixture-test
          cache-targets: true
          cache-on-failure: false
          # Prevent every PR from uploading multi-GB caches
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      - name: Build Chain-Signatures Integration Tests
        run: just build tests

      # Artifacts (contract wasm + node binary) build inside the test recipe via its setup dependency,
      # so setup.sh runs exactly once per job.
      - name: Test
        run: just test-fixture
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1

  # Integration tests that need Docker (near-sandbox, anvil, solana validator) and
  # additional Solana/Anchor setup. Runs with num-cpus threads (see .config/nextest.toml).
  cluster-test:
    name: Integration Test
    strategy:
      matrix:
        os: [warp-ubuntu-latest-x64-4x]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Comment on PR if this is a re-run
        if: github.run_attempt > 1 && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `⚠️ Integration tests were re-run (attempt ${process.env.RUN_ATTEMPT})`,
            });

      - uses: actions/checkout@v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Relayer, Sandbox, Redis Docker Images
        run: |
          docker pull redis:7.4.2

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          target: wasm32-unknown-unknown

      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json

      - name: Setup Solana and Anchor
        uses: metadaoproject/setup-anchor@v3.1
        with:
          solana-cli-version: '2.3.9'
          anchor-version: '0.30.1'

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-test
          cache-targets: true
          cache-on-failure: false
          # Prevent every PR from uploading multi-GB caches
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      - name: Build eth contract
        run: just build eth

      # Build the tests before actually running them to see how long the tests take to run by itself
      # instead of including the build time in the test time report on Github.
      # Artifacts build inside the test recipe via its setup dependency.
      - name: Build Chain-Signatures Integration Tests
        run: just build tests

      - name: Test
        run: just test-cluster
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1
          IT_ETH_ACCOUNT_SK: ${{ secrets.IT_ETH_ACCOUNT_SK }}
          IT_ETH_CONTRACT_ADDR: ${{ secrets.IT_ETH_CONTRACT_ADDR }}
          IT_ETH_CONSENSUS_RPC_URL: ${{ secrets.IT_ETH_CONSENSUS_RPC_URL }}
          IT_ETH_EXECUTION_RPC_URL: ${{ secrets.IT_ETH_EXECUTION_RPC_URL }}

  # Anvil-backed integration tests (no docker cluster): real EVM + real contract bytecode
  anvil-integration-test:
    name: Anvil Integration Tests
    runs-on: warp-ubuntu-latest-x64-4x

    steps:
      - uses: actions/checkout@v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0

      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: anvil-integration-test
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Clippy (integration-gated code)
        run: just lint-eth

      - name: Test
        run: just test-eth
