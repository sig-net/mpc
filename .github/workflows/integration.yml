name: Integration

on:
  push:
    branches:
      - develop
    paths:
      - integration-tests/**
      - chain-signatures/**
  pull_request:

env:
  RUSTFLAGS: -D warnings
jobs:
  test:
    name: Integration Test
    strategy:
      matrix:
        os: [warp-ubuntu-latest-x64-4x]
        backend: [cait-sith, near-threshold-signatures]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Docker
        if: ${{ matrix.os == 'macos-latest-xl' }}
        run: |
          brew install docker
          colima start
          # Colima does not expose the Docker socket by default, we have to symlink it
          # https://github.com/abiosoft/colima/blob/main/docs/FAQ.md#cannot-connect-to-the-docker-daemon-at-unixvarrundockersock-is-the-docker-daemon-running
          sudo ln -sf $HOME/.colima/default/docker.sock /var/run/docker.sock

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Relayer, Sandbox, Redis Docker Images
        run: |
          docker pull redis:7.4.2

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable

      - name: Install Rust (1.81.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.81.0
          target: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: "${{ runner.os }}-cargo-${{ hashFiles('chain-signatures/Cargo.lock') }}"
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Chain-Signatures Contract
        run: ./build-contract.sh

      - name: Build eth contract
        working-directory: ./chain-signatures/contract-eth
        run: npm i && npx hardhat compile

      - name: Build Chain-Signatures Node
        run: |
          if [ "${{ matrix.backend }}" = "near-threshold-signatures" ]; then
            cargo build -p mpc-node --release --features near-threshold-signatures
          else
            cargo build -p mpc-node --release
          fi

      # Build the tests before actually running them to see how long the tests take to run by itself
      # instead of including the build time in the test time report on Github.
      - name: Build Chain-Signatures Integration Tests
        run: |
          if [ "${{ matrix.backend }}" = "near-threshold-signatures" ]; then
            cargo build -p integration-tests --tests --features near-threshold-signatures
          else
            cargo build -p integration-tests --tests
          fi

      - name: Test
        run: |
          if [ "${{ matrix.backend }}" = "near-threshold-signatures" ]; then
            cargo test -p integration-tests --jobs 1 -- --test-threads 1 --features near-threshold-signatures
          else
            cargo test -p integration-tests --jobs 1 -- --test-threads 1
          fi
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1
