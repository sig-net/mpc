name: Integration

on:
  push:
    branches:
      - develop
    paths:
      - integration-tests/**
      - chain-signatures/**
  pull_request:
  merge_group:

env:
  RUSTFLAGS: -D warnings
jobs:
  # Fixture tests: in-process MPC protocol tests, no Docker or external infra needed.
  # Runs the `fixture` nextest profile (see .config/nextest.toml).
  fixture-test:
    name: Fixture Test
    runs-on: warp-ubuntu-latest-x64-4x

    steps:
      - name: Comment on PR if this is a re-run
        if: github.run_attempt > 1 && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `⚠️ Component tests (MPC fixture) were re-run (attempt ${process.env.RUN_ATTEMPT})`,
            });

      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Relayer, Sandbox, Redis Docker Images
        run: |
          docker pull redis:7.4.2

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          target: wasm32-unknown-unknown

      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fixture-test
          cache-targets: true
          cache-on-failure: false
          # Prevent every PR from uploading multi-GB caches
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      - name: Build integration test artifacts
        run: ./setup.sh

      # Build the tests before actually running them to see how long the tests take to run by itself
      # instead of including the build time in the test time report on Github.
      - name: Build Chain-Signatures Integration Tests
        run: cargo build -p integration-tests --tests

      - name: Test
        run: cargo nextest run -p integration-tests --profile fixture
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1

  midnight-real-stack:
    name: Midnight Real Stack
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chain-signatures/midnight-publisher-ts/package-lock.json

      - name: Restore Compact toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.compact
            ~/.local/bin/compact
          key: compact-${{ runner.os }}-launcher0.5.1-compactc0.33.0-rc.2

      - name: Install pinned Compact toolchain
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          if ! command -v compact >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -LsSf -o /tmp/compact-installer.sh https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.1/compact-installer.sh
            sh /tmp/compact-installer.sh
          fi
          RC_DIR="$HOME/.compact/versions/0.33.0-rc.2/x86_64-unknown-linux-musl"
          if [ ! -x "$RC_DIR/compactc" ]; then
            mkdir -p "$RC_DIR"
            curl -fsSL -o /tmp/compactc-rc.zip https://github.com/LFDT-Minokawa/compact/releases/download/compactc-v0.33.0-rc.2/compactc_v0.33.0-rc.2_x86_64-unknown-linux-musl.zip
            unzip -qo /tmp/compactc-rc.zip -d "$RC_DIR"
            chmod +x "$RC_DIR"/*
          fi
          compact update 0.33.0-rc.2 || ln -sfn "$RC_DIR"/* "$HOME/.compact/bin/"
          compact compile --version

      - name: Build real-stack TypeScript fixtures
        working-directory: chain-signatures/midnight-publisher-ts
        run: |
          npm ci
          npm run build
          npm run compile:real-stack-caller
          npm run typecheck:real-stack

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          target: wasm32-unknown-unknown

      - name: Install system OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Use system OpenSSL
        run: echo "OPENSSL_NO_VENDOR=1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: midnight-real-stack
          cache-targets: true
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf -o /tmp/cargo-near-installer.sh https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh
            sh /tmp/cargo-near-installer.sh
          fi

      - name: Pull pinned Midnight services
        run: |
          docker pull midnightntwrk/midnight-node:2.0.0-rc.4
          docker pull midnightntwrk/indexer-standalone:4.4.0-pre-alpha.16-l91r3-n2r3-bridge-and-events-epics-contract-zswap-16c656df
          docker pull midnightntwrk/proof-server:9.0.0-rc.5_experimental

      - name: Build integration artifacts
        run: MPC_SETUP_ALWAYS=1 ./setup.sh

      - name: List Midnight integration test
        run: |
          test_name='cases::midnight_stream::midnight_to_ethereum_to_midnight_consumes_caller_response'
          test_list=/tmp/midnight-real-stack-tests.txt
          cargo test -p integration-tests --test lib "$test_name" -- --exact --list > "$test_list"
          cat "$test_list"
          match_count=$(grep -Fxc "$test_name: test" "$test_list" || true)
          summary_count=$(grep -Fxc '1 test, 0 benchmarks' "$test_list" || true)
          if [ "$match_count" -ne 1 ]; then
            echo "expected exactly one Midnight real-stack test, found $match_count"
            exit 1
          fi
          if [ "$summary_count" -ne 1 ]; then
            echo "Midnight real-stack test listing did not report exactly one test"
            exit 1
          fi

      - name: Test Midnight end-to-end stream
        run: cargo test -p integration-tests --test lib 'cases::midnight_stream::midnight_to_ethereum_to_midnight_consumes_caller_response' -- --exact --ignored --nocapture --test-threads 1
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1

      - name: Upload Midnight service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-real-stack-logs
          path: target/tmp_*/midnight
          if-no-files-found: warn

  # Integration tests that need Docker (near-sandbox, anvil, solana validator) and
  # additional Solana/Anchor setup. Runs with num-cpus threads (see .config/nextest.toml).
  cluster-test:
    name: Integration Test
    strategy:
      matrix:
        # FIXME: macos-latest-xl is disabled since colima is erroring out right now
        os: [warp-ubuntu-latest-x64-4x]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Comment on PR if this is a re-run
        if: github.run_attempt > 1 && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `⚠️ Integration tests were re-run (attempt ${process.env.RUN_ATTEMPT})`,
            });

      - uses: actions/checkout@v6

      - name: Install Docker
        if: ${{ matrix.os == 'macos-latest-xl' }}
        run: |
          brew install docker
          colima start
          # Colima does not expose the Docker socket by default, we have to symlink it
          # https://github.com/abiosoft/colima/blob/main/docs/FAQ.md#cannot-connect-to-the-docker-daemon-at-unixvarrundockersock-is-the-docker-daemon-running
          sudo ln -sf $HOME/.colima/default/docker.sock /var/run/docker.sock

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Relayer, Sandbox, Redis Docker Images
        run: |
          docker pull redis:7.4.2

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0
          target: wasm32-unknown-unknown

      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json

      - name: Setup Solana and Anchor
        uses: metadaoproject/setup-anchor@v3.1
        with:
          solana-cli-version: '2.3.9'
          anchor-version: '0.30.1'

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-test
          cache-targets: true
          cache-on-failure: false
          # Prevent every PR from uploading multi-GB caches
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Build integration test artifacts
        run: ./setup.sh

      - name: Build eth contract
        working-directory: ./chain-signatures/contract-eth
        run: npm ci && npx hardhat compile

      # Build the tests before actually running them to see how long the tests take to run by itself
      # instead of including the build time in the test time report on Github.
      - name: Build Chain-Signatures Integration Tests
        run: cargo build -p integration-tests --tests

      - name: Test
        run: cargo nextest run -p integration-tests --profile cluster
        env:
          RUST_LOG: info,workspaces=warn
          RUST_BACKTRACE: 1
          IT_ETH_ACCOUNT_SK: ${{ secrets.IT_ETH_ACCOUNT_SK }}
          IT_ETH_CONTRACT_ADDR: ${{ secrets.IT_ETH_CONTRACT_ADDR }}
          IT_ETH_CONSENSUS_RPC_URL: ${{ secrets.IT_ETH_CONSENSUS_RPC_URL }}
          IT_ETH_EXECUTION_RPC_URL: ${{ secrets.IT_ETH_EXECUTION_RPC_URL }}

  # Anvil-backed integration tests (no docker cluster): real EVM + real contract bytecode
  anvil-integration-test:
    name: Anvil Integration Tests
    runs-on: warp-ubuntu-latest-x64-4x

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (1.93.0)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.93.0

      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: anvil-integration-test
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: chain-signatures/contract-eth/package-lock.json
      - name: Build eth contract artifact   # required by deploy_chain_signatures' include_bytes!
        working-directory: ./chain-signatures/contract-eth
        run: npm ci && npx hardhat compile

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Clippy (integration-gated code)
        run: cargo clippy -p mpc-chain-ethereum --tests --features integration -- -Dclippy::all

      - name: Test
        run: cargo test -p mpc-chain-ethereum --features integration --tests
