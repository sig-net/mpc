name: Deploy Dev Smart Contract
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - develop
    paths:
      - 'chain-signatures/contract/**'

jobs:
  deploy-contract:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: add JSON contract
        run: mkdir -p ~/.near-credentials/testnet && echo '${{ secrets.DEV_CONTRACT_JSON }}' > ~/.near-credentials/testnet/dev.sig-net.testnet.json

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install just
        run: |
          mkdir -p "$HOME/.cargo/bin"
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/casey/just/releases/download/1.54.0/just-1.54.0-x86_64-unknown-linux-musl.tar.gz" | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'latest'

      - name: Install near-cli
        run: 'npm install -g near-cli'

      - name: Install Rust (1.93.0)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # 1.93.0
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown

      - name: Install cargo-near
        run: |
          if ! command -v cargo-near >/dev/null; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
          fi

      - name: Detect dependency changes vs develop
        id: depchange
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin develop
          git diff --name-only FETCH_HEAD...HEAD |
            grep -qE '(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?)$|^\.cargo/|^\.github/workflows/' &&
            echo changed=true >> "$GITHUB_OUTPUT" || true

      # Cache policy: doc/ci-caching.md
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-dev
          cache-targets: true
          cache-on-failure: false
          # Only save the cache if there are dependency changes or it's not a merge group
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.depchange.outputs.changed == 'true') }}

      - name: Build & Deploy Dev Contract
        run: |
          just build contract
          (yes || true) | near deploy dev.sig-net.testnet target/near/mpc_contract/mpc_contract.wasm
          near call dev.sig-net.testnet migrate '{}' --accountId dev.sig-net.testnet --gas 300000000000000
