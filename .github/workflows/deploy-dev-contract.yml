name: Deploy Dev Contract
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - develop
    paths:
      - 'chain-signatures/contract/**'

jobs:
  deploy-contract:
    name: Build & Deploy Dev Contract
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: add JSON contract
        run: mkdir -p ~/.near-credentials/testnet && echo '${{ secrets.DEV_CONTRACT_JSON }}' > ~/.near-credentials/testnet/dev.sig-net.testnet.json

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install just
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.54.0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install near-cli
        run: 'npm install -g near-cli@4.0.13'

      - name: Install Rust (1.95.0)
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install cargo-near
        run: scripts/install-cargo-near.sh

      - name: Detect dependency changes vs develop
        id: depchange
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin develop
          # Two trees, no merge base: the shallow checkout has no common history.
          files=$(git diff --name-only FETCH_HEAD HEAD)
          if grep -qE '(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?)$|^\.cargo/|^\.github/workflows/' <<< "$files"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

      # Cache policy: doc/ci-caching.md
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-dev
          cache-targets: true
          cache-on-failure: false
          # Only save the cache if there are dependency changes or it's not a merge group
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.depchange.outputs.changed == 'true') }}

      - name: Build & Deploy Dev Contract
        run: |
          just build contract
          (yes || true) | near deploy dev.sig-net.testnet target/near/mpc_contract/mpc_contract.wasm
          near call dev.sig-net.testnet migrate '{}' --accountId dev.sig-net.testnet --gas 300000000000000
