name: k6 Bidirectional Load Test

# Drives the Solana -> Ethereum bidirectional round trip via
# loadtests/k6-bidirectional.js.
#
# Dispatch only: every job broadcasts an Ethereum transaction and spends gas
# from derived addresses that only a funding sweep refills.
on:
  workflow_dispatch:
    inputs:
      lt_strategy:
        description: Arrival rate per minute (the service caps at 10)
        type: choice
        options:
          - rpm_1
          - rpm_6
        default: rpm_1
        required: true
      lt_duration:
        description: How long to submit for, not how long the run takes
        type: choice
        options:
          - 5m
          - 20m
          - 1h
        default: 20m
        required: true
      environment:
        description: MPC network
        type: choice
        options:
          - dev
          - testnet
        default: dev
        required: true

permissions:
  contents: read

# The derived addresses are shared state: concurrent runs collide on their
# nonces. Queued rather than cancelled, since cancelling mid-flight abandons
# jobs whose Ethereum transaction is already paid for.
concurrency:
  group: k6-bidirectional-loadtest
  cancel-in-progress: false

jobs:
  loadtest:
    # Self-hosted, as k6-ci-loadtest.yml does for its scheduled runs. That one
    # keeps ubuntu-latest for push and pull_request because those finish in
    # minutes; every run here occupies a runner for over an hour, so there is
    # no short case to keep hosted.
    runs-on: arc-runner-set
    # Submission runs for lt_duration, then the scenario's 45m gracefulStop
    # lets in-flight jobs finish, so a 1h run occupies the runner for ~1h45m.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${LT_PINGER_API_KEY:-}" ]; then
            echo "::error::Missing required secret: LT_PINGER_API_KEY"
            exit 1
          fi
        env:
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}

      - uses: grafana/setup-k6-action@v1

      # Run k6 directly, not through run-k6-action: the script's thresholds are
      # the verdict, and --exit-on-running reports success once a test has
      # merely started. `k6 run` is last in the step, so tee cannot mask it.
      - name: Run k6
        run: |
          set -euo pipefail
          k6 run loadtests/k6-bidirectional.js 2>&1 | tee k6-bidirectional.log
        env:
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}
          LT_CHAIN_ENV: ${{ inputs.environment }}
          LT_STRATEGY: ${{ inputs.lt_strategy }}
          LT_DURATION: ${{ inputs.lt_duration }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## k6 Bidirectional Load Test"
            echo
            echo "- Network: \`${{ inputs.environment }}\`"
            echo "- Rate: \`${{ inputs.lt_strategy }}\` submitting for \`${{ inputs.lt_duration }}\`"
            echo
            if [ -f k6-bidirectional.log ]; then
              echo '```'
              # Thresholds and the bidi_* metrics live in the trailing summary.
              sed -n '/█ THRESHOLDS/,$p' k6-bidirectional.log | head -60
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
