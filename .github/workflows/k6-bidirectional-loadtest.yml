name: k6 Bidirectional Load Test

# Drives the Solana -> Ethereum bidirectional round trip against the deployed
# pinger, using loadtests/k6-bidirectional.js.
#
# Separate from k6-ci-loadtest.yml rather than a branch inside it. That workflow
# is shaped around /ping throughout — LT_CHAIN, LT_CHECK_SIGNATURE, the chain
# tag, and a normalize step carrying three sets of defaults — none of which mean
# anything for this flow. The branching would be larger than the file.
#
# Unscheduled on purpose. Every job broadcasts an Ethereum transaction and
# spends gas from derived addresses that only a funding sweep refills, so a
# recurring run is a standing cost that has to be chosen. Adding a schedule is
# also a claim about respond-leg timings that no green run has established yet;
# measure first, then decide the cadence and the thresholds together.
on:
  workflow_dispatch:
    inputs:
      lt_strategy:
        description: Arrival rate (per minute — the service caps at 10)
        type: choice
        options:
          - rate_1_min
          - rate_6_min
        default: rate_1_min
        required: true
      lt_duration:
        description: How long to submit for, not how long the run takes
        type: choice
        options:
          - 5m
          - 20m
          - 1h
        default: 20m
        required: true
      environment:
        description: MPC network
        type: choice
        options:
          - dev
          - testnet
        default: dev
        required: true
      lt_mode:
        description: Transaction mode
        type: choice
        options:
          - eth_self_transfer
          - erc20_zero_transfer
        default: eth_self_transfer
        required: true

permissions:
  contents: read

# The derived addresses are shared state: two runs would lease the same ones and
# collide on their nonces. Queued rather than cancelled, since cancelling
# mid-flight abandons jobs whose Ethereum transaction is already paid for.
#
# This only serialises runs of this workflow. The same addresses are also
# reachable from contract-pinger's own workflows and from anything driving the
# deployed service directly, and no group spans repositories.
concurrency:
  group: k6-bidirectional-loadtest
  cancel-in-progress: false

jobs:
  loadtest:
    runs-on: ubuntu-latest
    # Submission runs for lt_duration, then the scenario's 45m gracefulStop lets
    # jobs still in flight finish and be measured. A 1h submission therefore
    # occupies the runner for up to 1h45m; the rest is headroom for setup.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${LT_PINGER_API_KEY:-}" ]; then
            echo "::error::Missing required secret: LT_PINGER_API_KEY"
            exit 1
          fi
        env:
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}

      - uses: grafana/setup-k6-action@v1

      # k6 runs locally rather than through run-k6-action, so its exit code is
      # this step's exit code. The script's thresholds are the verdict, and a
      # wrapper that reports success once a test has *started* would make a
      # failing load test green — which is exactly what --exit-on-running does
      # to the /ping workflow's push and pull_request runs today.
      #
      # `k6 run` is the last command in the step and pipefail is set, so the
      # tee does not mask a threshold failure.
      #
      # The script's setup() reads the worker balances first and aborts if any
      # derived address is short: the path count sets concurrency, so a partly
      # funded pool measures a narrower pool than the run claims to apply.
      - name: Run k6
        run: |
          set -euo pipefail
          k6 run loadtests/k6-bidirectional.js 2>&1 | tee k6-bidirectional.log
        env:
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}
          LT_CHAIN_ENV: ${{ inputs.environment }}
          LT_MODE: ${{ inputs.lt_mode }}
          LT_STRATEGY: ${{ inputs.lt_strategy }}
          LT_DURATION: ${{ inputs.lt_duration }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## k6 Bidirectional Load Test"
            echo
            echo "- Network: \`${{ inputs.environment }}\`"
            echo "- Mode: \`${{ inputs.lt_mode }}\`"
            echo "- Rate: \`${{ inputs.lt_strategy }}\` submitting for \`${{ inputs.lt_duration }}\`"
            echo
            if [ -f k6-bidirectional.log ]; then
              echo '```'
              # Thresholds, the custom bidi_* metrics and the phase breakdown
              # all live in the trailing summary block.
              sed -n '/█ THRESHOLDS/,$p' k6-bidirectional.log | head -60
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
