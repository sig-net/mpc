name: k6 Bidirectional Load Test

# Drives Solana or Midnight -> Ethereum bidirectional round trips via
# loadtests/k6-bidirectional.js.
#
# Every job spends gas from addresses only a funding sweep refills, so the
# cadence is a standing cost. A tick landing mid-run creates no run, so the
# short interval only shortens the wait after one ends.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      source_chain:
        description: Source chain (Midnight runs serially, at most one start/minute)
        type: choice
        options:
          - solana
          - midnight
        default: solana
        required: true
      lt_strategy:
        description: Solana arrivals per minute (mainnet always uses rpm_1; Midnight uses serial)
        type: choice
        options:
          - rpm_1
          - rpm_6
        default: rpm_1
        required: true
      lt_duration:
        description: How long to submit for, not how long the run takes (cron uses 2h)
        type: choice
        options:
          - 5m
          - 20m
          - 1h
          - 2h
        default: 20m
        required: true
      environment:
        description: MPC network (both selects dev/testnet for Solana, stagenet for Midnight)
        type: choice
        options:
          - both
          - dev
          - testnet
          - mainnet
          - stagenet
        default: both
        required: true

permissions:
  contents: read

jobs:
  loadtest:
    strategy:
      # Scheduled Midnight starts only after its service has been configured
      # and LT_MIDNIGHT_ENABLED is set to true. Manual runs remain available.
      matrix:
        include: ${{ (github.event_name == 'schedule' && vars.LT_MIDNIGHT_ENABLED == 'true'
              && fromJSON('[{"source":"solana","environment":"dev"},{"source":"solana","environment":"testnet"},{"source":"midnight","environment":"stagenet"}]'))
          || (github.event_name == 'schedule'
              && fromJSON('[{"source":"solana","environment":"dev"},{"source":"solana","environment":"testnet"}]'))
          || (inputs.source_chain == 'midnight' && (inputs.environment == 'both' || inputs.environment == 'stagenet')
              && fromJSON('[{"source":"midnight","environment":"stagenet"}]'))
          || (inputs.source_chain == 'solana' && inputs.environment == 'both'
              && fromJSON('[{"source":"solana","environment":"dev"},{"source":"solana","environment":"testnet"}]'))
          || (inputs.source_chain == 'solana' && inputs.environment == 'dev'
              && fromJSON('[{"source":"solana","environment":"dev"}]'))
          || (inputs.source_chain == 'solana' && inputs.environment == 'testnet'
              && fromJSON('[{"source":"solana","environment":"testnet"}]'))
          || (inputs.source_chain == 'solana' && inputs.environment == 'mainnet'
              && fromJSON('[{"source":"solana","environment":"mainnet"}]'))
          || fromJSON('[{"source":"unmatched","environment":"unmatched"}]') }}
      # The networks hold separate address pools and rate limits, so they
      # need no max-parallel.
      fail-fast: false
    # Per network: overlapping runs would double the arrival rate one claims
    # to apply. Queued, since cancelling abandons jobs already paid for.
    concurrency:
      group: k6-bidirectional-${{ matrix.source }}-${{ matrix.environment }}
      cancel-in-progress: false
    # Self-hosted: every run holds a runner for over an hour.
    runs-on: arc-runner-set
    # Midnight allows 90m for proving/signing/finality after the submission window.
    timeout-minutes: ${{ matrix.source == 'midnight' && 230 || 200 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${LT_PINGER_API_KEY:-}" ]; then
            echo "::error::Missing required secret: LT_PINGER_API_KEY"
            exit 1
          fi
          # What the matrix yields for an unrecognised input.
          case "${LT_SOURCE_CHAIN}:${LT_CHAIN_ENV}" in
            solana:dev | solana:testnet | solana:mainnet | midnight:stagenet) ;;
            *)
              echo "::error::Unsupported source/environment selection"
              exit 1
              ;;
          esac
        env:
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}
          LT_CHAIN_ENV: ${{ matrix.environment }}
          LT_SOURCE_CHAIN: ${{ matrix.source }}

      # near-dev-github holds secretAccessor on the three secrets below and
      # nothing else. The runner pods have no GCP identity of their own.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.SIG_CREDENTIALS_DEV }}'

      # The collectors' own credentials, read at run time so there is no second
      # copy to keep level. Masked, which `gcloud ... >> GITHUB_ENV` is not.
      - name: Read Grafana credentials
        id: grafana
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        with:
          secrets: |-
            push_url:near-cs-dev/prom-push-url
            username:near-cs-dev/grafana-username
            password:near-cs-dev/grafana_cloud_pswd

      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      # Run k6 directly, not through run-k6-action: the script's thresholds are
      # the verdict, and --exit-on-running reports success once a test has
      # merely started. `k6 run` is last in the step, so tee cannot mask it.
      - name: Run k6
        run: |
          set -euo pipefail
          k6 run -o experimental-prometheus-rw \
            --tag source_chain="${LT_SOURCE_CHAIN}" \
            --tag env="${LT_CHAIN_ENV}" \
            loadtests/k6-bidirectional.js 2>&1 | tee k6-bidirectional.log
        env:
          K6_PROMETHEUS_RW_SERVER_URL: ${{ steps.grafana.outputs.push_url }}
          K6_PROMETHEUS_RW_USERNAME: ${{ steps.grafana.outputs.username }}
          K6_PROMETHEUS_RW_PASSWORD: ${{ steps.grafana.outputs.password }}
          # Percentiles cannot be averaged, so pre-computed stats are wrong
          # over any window but one scrape. Histograms are exact over any.
          K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: 'true'
          # No run_id tag: runs are separated in time, so the range is the run,
          # and the label would fragment every panel wider than one. env is
          # needed: without it both networks write the same series.
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}
          LT_CHAIN_ENV: ${{ matrix.environment }}
          LT_SOURCE_CHAIN: ${{ matrix.source }}
          LT_STRATEGY: ${{ matrix.source == 'midnight' && 'serial' || matrix.environment == 'mainnet' && 'rpm_1' || inputs.lt_strategy || 'rpm_1' }}
          LT_DURATION: ${{ inputs.lt_duration || '2h' }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## k6 Bidirectional Load Test"
            echo
            echo "- Source/network: \`${{ matrix.source }}/${{ matrix.environment }}\`"
            echo "- Workload: \`${{ matrix.source == 'midnight' && 'serial (one active job, at most one start/minute)' || matrix.environment == 'mainnet' && 'rpm_1' || inputs.lt_strategy || 'rpm_1' }}\` submitting for \`${{ inputs.lt_duration || '2h' }}\`"
            echo
            if [ -f k6-bidirectional.log ]; then
              echo '```'
              # Thresholds and the bidi_* metrics live in the trailing summary.
              sed -n '/█ THRESHOLDS/,$p' k6-bidirectional.log | head -60
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
