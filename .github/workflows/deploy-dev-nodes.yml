name: Deploy Dev Nodes
on:
  push:
    branches:
      - develop
    paths:
      - chain-signatures/**
      - Cargo.*

env:
  IMAGE: "europe-west1-docker.pkg.dev/near-cs-dev/multichain-public/multichain-dev"
  TAG: ${{ github.sha }}

jobs:
  # The dev nodes poll this image repository, so pushing the image is the deployment.
  build-image:
    name: Build & Push Dev Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Login to GCP Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.SIG_CREDENTIALS_DEV }}

      - name: Build Docker image and push to Google Artifact Registry
        id: docker-push-tagged
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
        with:
          push: true
          file: ./Dockerfile
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
          tags: "${{ env.IMAGE }}:${{ env.TAG }},${{ env.IMAGE }}:latest"
