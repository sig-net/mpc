name: Unit Tests
on:
  pull_request:
  merge_group:
  # Cache policy: doc/ci-caching.md
  push:
    branches: [develop]
    paths: [Cargo.lock, "**/Cargo.toml", ".cargo/**", "deny.toml", "rust-toolchain*", .github/workflows/test-unit.yml]
  workflow_dispatch:
  # Daily advisories check on develop; see the advisories job.
  schedule:
    - cron: '0 5 * * *'

env:
  RUSTFLAGS: -D warnings
# Cancel superseded runs of the same PR. Merge-queue and develop runs keep going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: warp-ubuntu-latest-x64-4x
    name: Lint & Unit Tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust (1.100.0)
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Detect dependency changes vs develop
        id: depchange
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin develop
          # Two trees, no merge base: the shallow checkout has no common history.
          files=$(git diff --name-only FETCH_HEAD HEAD)
          if grep -qE '(^|/)(Cargo\.toml|Cargo\.lock|rust-toolchain(\.toml)?)$|^\.cargo/|^\.github/workflows/' <<< "$files"; then
            echo changed=true >> "$GITHUB_OUTPUT"
          fi

      # Cache policy: doc/ci-caching.md
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: workspace-dev
          cache-targets: true
          cache-on-failure: false
          # Only save the cache if there are dependency changes or it's not a merge group
          save-if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.depchange.outputs.changed == 'true') }}
      
      # After the cache restore, which also restores ~/.cargo/bin over earlier installs.
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.54.0,nextest@0.9.145

      # Install system OpenSSL explicitly here so the build uses system OpenSSL instead of building OpenSSL from source
      - name: Install system OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Set OpenSSL to system
        run: echo "OPENSSL_NO_VENDOR=1" >> $GITHUB_ENV

      - name: Install cargo-near
        run: scripts/install-cargo-near.sh

      - name: Compile Contract
        run: just build contract

      - name: Test format
        run: just fmt-check
      
      - name: Test clippy
        run: just lint
      
      - name: Unit tests
        run: just test-unit

      # Each test migrates a live contract's state. A branch never upgrades the contracts
      # before it (develop -> testnet -> mainnet), so those are skipped. Merge queue runs all.
      - name: Migration test, dev contract
        if: github.base_ref != 'testnet' && github.base_ref != 'mainnet'
        run: cargo nextest run -p mpc-contract --run-ignored only -E 'test(=test_migrate_dev_state)'

      - name: Migration test, testnet contract
        if: github.base_ref != 'mainnet'
        run: cargo nextest run -p mpc-contract --run-ignored only -E 'test(=test_migrate_testnet_state)'

      - name: Migration test, mainnet contract
        run: cargo nextest run -p mpc-contract --run-ignored only -E 'test(=test_migrate_mainnet_state)'

      - name: Midnight sandbox-gated tests
        run: |
          cargo test -p mpc-chain-midnight --lib --features sandbox output_storage::tests
          cargo test -p mpc-chain-midnight --lib --features sandbox probing_a_node_on_an_unlisted_network

      - name: Check build left no uncommitted changes
        if: ${{ !cancelled() }}
        run: git diff --text --exit-code

  audit:
    name: Dependency Audit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0

      # Check the feature-resolved dependency graph: license compliance,
      # dependency bans and source allow-listing. Advisories run in their own job.
      - name: Check dependencies (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check bans licenses sources --hide-inclusion-graph

      - name: Install cargo-machete
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-machete@0.9.2

      - name: Check for unused dependencies (cargo-machete)
        run: cargo machete

  # A new RustSec advisory fails every build that checks it, whatever the PR
  # changes. So PRs and merge groups check advisories only when they change
  # Cargo.lock or deny.toml; develop is checked daily, and a failure opens an issue.
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect Cargo.lock or deny.toml changes
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qxE 'Cargo\.lock|deny\.toml'; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cargo.lock and deny.toml unchanged; advisories are checked daily on develop."
          fi

      - name: Install Rust toolchain
        if: steps.scope.outputs.check == 'true'
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          toolchain: 1.95.0

      - name: Install cargo-deny
        if: steps.scope.outputs.check == 'true'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2

      # Vulnerabilities deny; `unmaintained`/`unsound` are warnings.
      - name: Check advisories (cargo-deny)
        if: steps.scope.outputs.check == 'true'
        run: |
          set -o pipefail
          cargo deny --color never check advisories -W unmaintained -W unsound --hide-inclusion-graph 2>&1 | tee advisories.txt

      - name: Report on develop
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dependency advisories on develop"
          { echo "The daily advisories check failed: $RUN_URL"; echo; echo '```'; grep -E '^(error|warning)\[|ID:|Advisory:' advisories.txt | head -100; echo '```'; } > body.md
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
