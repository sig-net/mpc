name: PR Title and Breaking Changes

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  # Must be reported for merge groups, even though there is no title to validate
  merge_group:

permissions:
  pull-requests: read

jobs:
  lint:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      # Using default settings:
      # types: feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert
      # requireScope: false, disallowScopes: none, subjectPattern: none
      # wip: false (draft PRs are VALIDATED)
      # More configuration options - https://github.com/amannn/action-semantic-pull-request#configuration
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        # Only run this action for pull request events - merge group events do not have a title to validate
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  breaking-changes:
    name: Breaking Changes Section
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      # Breaking changes must have one state: `None`, or one or more types. A
      # ticked type needs `!` in the title and `None` must not have it. Design
      # must not keep the template's placeholder link. Release, promotion and
      # hotfix PRs have neither section and are skipped.
      - name: Check the Breaking changes and Design sections
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$TITLE" in
            "chore: release "*|"fix: hotfix "*) echo "release or hotfix PR, skipped"; exit 0;;
          esac
          section=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^## Breaking changes/{f=1;next} /^## /{f=0} f')
          none=$(printf '%s\n' "$section" | grep -c -E '^- \[[xX]\] None' || true)
          types=$(printf '%s\n' "$section" | grep -c -E '^- \[[xX]\] (Node.Node|Contract.Node|Contract state|Network.Applications|Operator)' || true)
          if printf '%s' "$TITLE" | grep -q -E '^[a-z]+(\([^)]*\))?!:'; then bang=1; else bang=0; fi
          fail() { echo "::error::$1"; exit 1; }
          [ "$((none + types))" -gt 0 ] || fail "Breaking changes: tick None or every type that applies"
          [ "$none" -eq 0 ] || [ "$types" -eq 0 ] || fail "Breaking changes: None cannot be ticked together with a type"
          [ "$types" -eq 0 ] || [ "$bang" -eq 1 ] || fail "Breaking changes ticked: add '!' to the title, e.g. 'feat(node)!: ...'"
          [ "$bang" -eq 0 ] || [ "$types" -gt 0 ] || fail "Title has '!' but no breaking type is ticked"
          design=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^## Design/{f=1;next} /^## /{f=0} f')
          ! printf '%s\n' "$design" | grep -q -E '^- \[[xX]\] .*\[(issue )?link\]' || fail "Design: replace the [link] placeholder"
          echo "ok: none=$none types=$types bang=$bang"
