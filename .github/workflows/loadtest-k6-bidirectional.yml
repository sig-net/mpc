name: k6 Bidirectional Load Test

# Two tiers of Solana -> Ethereum bidirectional load, driven by
# loadtests/k6-bidirectional.js:
#  - low: 1 job a minute against the deployed pinger, all day, so Grafana has a
#    latency series to alert on and the deployed service is known to work;
#  - high: a ramp from 1 to 10 jobs a second, twice a day, against a pinger of
#    its own on the runner. The deployed pinger holds a pool of ten addresses
#    and its own job caps, so it is neither sized for this nor a thing to
#    disturb. The run builds contract-pinger, funds the addresses it needs,
#    starts the pinger and drives it.
#
# A rate per minute (rpm_*) drives the deployed pinger; a rate per second
# (rps_*, ramp_*) starts a pinger of its own.
#
# Every job spends gas from addresses only a funding sweep refills, so the
# cadence is a standing cost. The high tier runs about 2,430 jobs, roughly 0.06
# ETH of Sepolia gas (0.0000234 ETH each, measured for eth_self_transfer) plus
# Solana fees from the requester. The first run also fills about 730 addresses
# with roughly 0.8 ETH, which stays on them and is reused. These are estimates.
#
# Off-the-hour minutes drawn at random: GitHub delays or drops schedules most at
# the minutes everyone else uses.
on:
  schedule:
    # Low: 1 job a minute for 2h. A tick landing mid-run creates no run, so the
    # short interval only shortens the wait after one ends.
    - cron: '*/20 * * * *'
    # High: the 12-minute ramp. Clear of the unidirectional tiers in
    # loadtest-k6.yml (02:59, 09:42, 14:59, 21:42), which load the same network.
    - cron: '23 6,18 * * *'
  workflow_dispatch:
    inputs:
      lt_strategy:
        description: rpm_* drives the deployed pinger; rps_* and ramp_1_10 start a pinger of their own
        type: choice
        options:
          - rpm_1
          - rpm_6
          - rps_1
          - rps_3
          - rps_10
          - ramp_1_10
        default: rpm_1
        required: true
      lt_duration:
        description: How long to submit for, not how long the run takes (cron uses 2h; ramp_1_10 ignores it)
        type: choice
        options:
          - 5m
          - 20m
          - 1h
          - 2h
        default: 20m
        required: true
      environment:
        description: MPC network (a run with its own pinger needs one)
        type: choice
        options:
          - both
          - dev
          - testnet
        default: both
        required: true
      pinger_ref:
        description: Own-pinger runs only. contract-pinger ref to run (must be on main)
        type: string
        default: main
        required: true
      path_prefix:
        description: Own-pinger runs only. Address prefix; must differ from the deployed pinger's
        type: string
        default: burst
        required: true
      fund:
        description: Own-pinger runs only. Top up addresses holding less than the run needs
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  # A schedule carries no inputs, so every setting is resolved here, once, for
  # both jobs below.
  select:
    name: Select run
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      strategy: ${{ steps.select.outputs.strategy }}
      duration: ${{ steps.select.outputs.duration }}
      environment: ${{ steps.select.outputs.environment }}
      environments: ${{ steps.select.outputs.environments }}
      pinger_ref: ${{ steps.select.outputs.pinger_ref }}
      path_prefix: ${{ steps.select.outputs.path_prefix }}
      fund: ${{ steps.select.outputs.fund }}
    steps:
      - name: Resolve the run
        id: select
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "schedule" ]; then
            case "${SCHEDULE}" in
              '23 6,18 * * *')
                strategy=ramp_1_10
                environment=dev
                ;;
              *)
                strategy=rpm_1
                environment=both
                ;;
            esac
            [ "${strategy}" = "rpm_1" ] && duration=2h || duration=5m
            pinger_ref=main
            path_prefix=burst
            fund=true
          else
            strategy="${INPUT_STRATEGY}"
            duration="${INPUT_DURATION}"
            environment="${INPUT_ENVIRONMENT}"
            pinger_ref="${INPUT_PINGER_REF}"
            path_prefix="${INPUT_PATH_PREFIX}"
            fund="${INPUT_FUND}"
          fi

          case "${strategy}" in
            rpm_*) mode=deployed ;;
            rps_* | ramp_*) mode=isolated ;;
            *)
              echo "::error::Unhandled strategy '${strategy}': add it to the mode selection"
              exit 1
              ;;
          esac

          case "${environment}" in
            both)
              if [ "${mode}" = "isolated" ]; then
                echo "::error::A run with its own pinger uses one network: pick dev or testnet"
                exit 1
              fi
              environments='["dev","testnet"]'
              ;;
            dev | testnet)
              environments="[\"${environment}\"]"
              ;;
            *)
              echo "::error::Unhandled environment '${environment}': add it to the selection"
              exit 1
              ;;
          esac

          {
            echo "mode=${mode}"
            echo "strategy=${strategy}"
            echo "duration=${duration}"
            echo "environment=${environment}"
            echo "environments=${environments}"
            echo "pinger_ref=${pinger_ref}"
            echo "path_prefix=${path_prefix}"
            echo "fund=${fund}"
          } >> "${GITHUB_OUTPUT}"
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_STRATEGY: ${{ inputs.lt_strategy }}
          INPUT_DURATION: ${{ inputs.lt_duration }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_PINGER_REF: ${{ inputs.pinger_ref }}
          INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
          INPUT_FUND: ${{ inputs.fund }}

  deployed:
    name: Bidirectional Load Test (${{ matrix.environment }})
    needs: select
    if: needs.select.outputs.mode == 'deployed'
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.select.outputs.environments) }}
      # The networks hold separate address pools, so they need no max-parallel.
      fail-fast: false
    # Per network: overlapping runs would double the arrival rate one claims
    # to apply. Queued, since cancelling abandons jobs already paid for.
    concurrency:
      group: k6-bidirectional-${{ matrix.environment }}
      cancel-in-progress: false
    # Self-hosted: every run holds a runner for over an hour.
    runs-on: arc-runner-set
    # Submission runs for lt_duration, then the collector waits up to 45m for
    # in-flight jobs to settle.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${LT_PINGER_API_KEY:-}" ]; then
            echo "::error::Missing required secret: LT_PINGER_API_KEY"
            exit 1
          fi
        env:
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}

      # near-dev-github holds secretAccessor on the three secrets below and
      # nothing else. The runner pods have no GCP identity of their own.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.SIG_CREDENTIALS_DEV }}'

      # The collectors' own credentials, read at run time so there is no second
      # copy to keep level. Masked, which `gcloud ... >> GITHUB_ENV` is not.
      - name: Read Grafana credentials
        id: grafana
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        with:
          secrets: |-
            push_url:near-cs-dev/prom-push-url
            username:near-cs-dev/grafana-username
            password:near-cs-dev/grafana_cloud_pswd

      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      # Run k6 directly, not through run-k6-action: the script's thresholds are
      # the verdict, and --exit-on-running reports success once a test has
      # merely started. `k6 run` is last in the step, so tee cannot mask it.
      - name: Run k6
        run: |
          set -euo pipefail
          k6 run -o experimental-prometheus-rw \
            --tag env="${LT_CHAIN_ENV}" \
            loadtests/k6-bidirectional.js 2>&1 | tee k6-bidirectional.log
        env:
          K6_PROMETHEUS_RW_SERVER_URL: ${{ steps.grafana.outputs.push_url }}
          K6_PROMETHEUS_RW_USERNAME: ${{ steps.grafana.outputs.username }}
          K6_PROMETHEUS_RW_PASSWORD: ${{ steps.grafana.outputs.password }}
          # Percentiles cannot be averaged, so pre-computed stats are wrong
          # over any window but one scrape. Histograms are exact over any.
          K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: 'true'
          # No run_id tag: runs are separated in time, so the range is the run,
          # and the label would fragment every panel wider than one. env is
          # needed: without it both networks write the same series.
          LT_PINGER_URL: https://contract-ping.sig.network
          LT_PINGER_API_KEY: ${{ secrets.LT_PINGER_API_KEY }}
          LT_CHAIN_ENV: ${{ matrix.environment }}
          LT_STRATEGY: ${{ needs.select.outputs.strategy }}
          LT_DURATION: ${{ needs.select.outputs.duration }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## k6 Bidirectional Load Test"
            echo
            echo "- Network: \`${{ matrix.environment }}\`"
            echo "- Rate: \`${{ needs.select.outputs.strategy }}\` submitting for \`${{ needs.select.outputs.duration }}\`"
            echo
            if [ -f k6-bidirectional.log ]; then
              echo '```'
              # Thresholds and the bidi_* metrics live in the trailing summary.
              sed -n '/█ THRESHOLDS/,$p' k6-bidirectional.log | head -60
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Runs a contract pinger of its own on the runner, so a high rate needs
  # neither the deployed pinger resized nor its address pool and job caps.
  #
  # The pinger's addresses follow from the requester key, the path prefix and an
  # index. The prefix is fixed, so the same funded set is reused from run to
  # run, and it must differ from the deployed pinger's or the two would lease
  # the same addresses and collide on nonces. ETH sent to an address can only be
  # moved by an MPC-signed transaction, so nothing here takes it back.
  isolated:
    name: Isolated Bidirectional Load Test (${{ needs.select.outputs.environment }})
    needs: select
    if: needs.select.outputs.mode == 'isolated'
    # The funded addresses are shared state: two runs on one prefix would lease
    # the same ones and collide on their nonces. Queued, since cancelling
    # mid-run abandons jobs that have already paid for their transactions.
    concurrency:
      group: k6-bidirectional-isolated-${{ needs.select.outputs.environment }}-${{ needs.select.outputs.path_prefix }}
      cancel-in-progress: false
    # Self-hosted: a run holds its runner for the first fill of the addresses,
    # the submission, and then up to 45 minutes for the last jobs to settle.
    runs-on: arc-runner-set
    timeout-minutes: 240
    # Holds the pinger's secrets. Restrict it to the default branch rather than
    # requiring reviewers, which would hold every scheduled run for approval.
    environment: Pinger Load Test
    env:
      PORT: '3001'
      SIG_BIDIRECTIONAL_PATH_PREFIX: ${{ needs.select.outputs.path_prefix }}
      # Low enough that an address needs little to be leasable. The default
      # floor would tie up several times what these runs spend.
      SIG_BIDIRECTIONAL_MIN_BALANCE_WEI: '300000000000000'
      # A first fill of a few hundred addresses is past the default per-run cap,
      # which is sized for the scheduled sweep.
      SIG_BIDIRECTIONAL_FUND_MAX_PER_RUN_ETH: '1'
      SIG_ETH_RPC_URL_SEPOLIA: ${{ secrets.SIG_ETH_RPC_URL_SEPOLIA }}
      SIG_SOL_RPC_URL_DEV: ${{ secrets.SIG_SOL_RPC_URL_DEV }}
      SIG_SOL_SK: ${{ secrets.SIG_SOL_SK }}
      SIG_BIDIRECTIONAL_FUNDING_SK: ${{ secrets.SIG_BIDIRECTIONAL_FUNDING_SK }}
      SIG_SOL_ROOT_PUBLIC_KEY: ${{ vars.SIG_SOL_ROOT_PUBLIC_KEY }}
      LT_CHAIN_ENV: ${{ needs.select.outputs.environment }}
    steps:
      # The k6 script, and the strategies the run is sized from.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sig-net/contract-pinger
          ref: ${{ needs.select.outputs.pinger_ref }}
          path: pinger
          fetch-depth: 0

      - name: Refuse a ref that is not on main
        working-directory: pinger
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::contract-pinger ${PINGER_REF} is not on main. This run holds the funding key, so it only runs reviewed code."
            exit 1
          fi
        env:
          PINGER_REF: ${{ needs.select.outputs.pinger_ref }}

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for name in SIG_ETH_RPC_URL_SEPOLIA SIG_SOL_RPC_URL_DEV SIG_SOL_SK SIG_BIDIRECTIONAL_FUNDING_SK; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'

      # corepack reads the pnpm version from the pinger's package.json.
      - name: Install and build the pinger
        working-directory: pinger
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      # From the same strategies the k6 script runs, so the pinger and its
      # funding are sized for exactly what will be submitted.
      - name: Size the run
        id: plan
        run: |
          set -euo pipefail
          node loadtests/plan.mjs "${LT_STRATEGY}" "${LT_DURATION}" | tee -a "${GITHUB_OUTPUT}"
        env:
          LT_STRATEGY: ${{ needs.select.outputs.strategy }}
          LT_DURATION: ${{ needs.select.outputs.duration }}

      # This run's own pinger, so its secret is generated rather than shared.
      - name: Generate the pinger's API secret
        run: |
          set -euo pipefail
          secret=$(openssl rand -hex 16)
          echo "::add-mask::${secret}"
          echo "LT_API_SECRET=${secret}" >> "${GITHUB_ENV}"

      # Sized to the busiest address, and a no-op for any address already
      # holding it. A first fill sends hundreds of transfers, sixteen at a time.
      # An empty funding wallet fails here, naming the address to top up.
      - name: Fund the addresses the run will use
        if: needs.select.outputs.fund == 'true'
        working-directory: pinger
        run: |
          set -euo pipefail
          pnpm fund --env "${LT_CHAIN_ENV}" --address-jobs "${ADDRESS_JOBS}" 2>&1 | tee ../fund.log
        env:
          ADDRESS_JOBS: ${{ steps.plan.outputs.address_jobs }}
          SIG_BIDIRECTIONAL_PATHS: ${{ steps.plan.outputs.paths }}

      - name: Start the pinger
        working-directory: pinger
        run: |
          set -euo pipefail
          # `node` directly, not `pnpm start`: pnpm forks the server as a child,
          # so `$!` would capture the wrapper and the stop step would leave the
          # real process running.
          node dist/index.js > ../pinger.log 2>&1 &
          echo $! > ../pinger.pid
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/" > /dev/null; then
              echo "pinger up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pinger did not start"
          cat ../pinger.log
          exit 1
        env:
          API_SECRET: ${{ env.LT_API_SECRET }}
          SIG_BIDIRECTIONAL_PATHS: ${{ steps.plan.outputs.paths }}
          SIG_BIDIRECTIONAL_MAX_JOBS: ${{ steps.plan.outputs.jobs }}
          SIG_BIDIRECTIONAL_RETAINED_JOBS: ${{ steps.plan.outputs.jobs }}

      # The authoritative check, and the only one that reads what the addresses
      # actually hold. A top-up that was skipped or refused is not a reason to
      # submit jobs that cannot broadcast.
      - name: Check worker funding
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 900 \
            -H "x-api-secret: ${LT_API_SECRET}" \
            "http://localhost:${PORT}/sign_bidirectional/workers?env=${LT_CHAIN_ENV}" \
            > workers.json
          short=$(jq '[.workers[] | select(.underfunded)] | length' workers.json)
          total=$(jq '.workers | length' workers.json)
          echo "${short}/${total} addresses below the minimum"
          if [ "${short}" -gt 0 ]; then
            jq -r '[.workers[] | select(.underfunded)][0:20][] | "::error::underfunded: \(.path) \(.address) holds \(.balanceWei) wei"' workers.json
            echo "::error::${short}/${total} addresses are below the minimum. Re-run with fund enabled, or top up the funding wallet."
            exit 1
          fi

      # near-dev-github holds secretAccessor on the three secrets below and
      # nothing else. The runner pods have no GCP identity of their own.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.SIG_CREDENTIALS_DEV }}'

      # The collectors' own credentials, read at run time so there is no second
      # copy to keep level. Masked, which `gcloud ... >> GITHUB_ENV` is not.
      - name: Read Grafana credentials
        id: grafana
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        with:
          secrets: |-
            push_url:near-cs-dev/prom-push-url
            username:near-cs-dev/grafana-username
            password:near-cs-dev/grafana_cloud_pswd

      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      # Run k6 directly, not through run-k6-action: the script's thresholds are
      # the verdict, and --exit-on-running reports success once a test has
      # merely started. `k6 run` is last in the step, so tee cannot mask it.
      # The kind tag keeps these runs out of the deployed pinger's series.
      - name: Run k6
        run: |
          set -euo pipefail
          k6 run -o experimental-prometheus-rw \
            --tag env="${LT_CHAIN_ENV}" \
            --tag kind=isolated \
            loadtests/k6-bidirectional.js 2>&1 | tee k6-bidirectional.log
        env:
          K6_PROMETHEUS_RW_SERVER_URL: ${{ steps.grafana.outputs.push_url }}
          K6_PROMETHEUS_RW_USERNAME: ${{ steps.grafana.outputs.username }}
          K6_PROMETHEUS_RW_PASSWORD: ${{ steps.grafana.outputs.password }}
          K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: 'true'
          LT_PINGER_URL: http://localhost:3001
          LT_PINGER_API_KEY: ${{ env.LT_API_SECRET }}
          LT_STRATEGY: ${{ needs.select.outputs.strategy }}
          LT_DURATION: ${{ needs.select.outputs.duration }}

      - name: Stop the pinger
        if: always()
        run: |
          [ -f pinger.pid ] && kill "$(cat pinger.pid)" 2>/dev/null || true
          echo "--- last 40 lines of the pinger log ---"
          tail -40 pinger.log || true

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## k6 Bidirectional Load Test (isolated pinger)"
            echo
            echo "- Network: \`${{ needs.select.outputs.environment }}\`"
            echo "- Rate: \`${{ needs.select.outputs.strategy }}\` for \`${{ steps.plan.outputs.total_seconds }}s\`, about ${{ steps.plan.outputs.jobs }} jobs"
            echo "- Addresses: ${{ steps.plan.outputs.paths }} under prefix \`${{ needs.select.outputs.path_prefix }}\`, funded for ${{ steps.plan.outputs.address_jobs }} jobs each"
            echo "- contract-pinger: \`${{ needs.select.outputs.pinger_ref }}\`"
            echo
            if [ -f fund.log ]; then
              echo '```'
              tail -8 fund.log
              echo '```'
            fi
            if [ -f k6-bidirectional.log ]; then
              echo '```'
              # Thresholds and the bidi_* metrics live in the trailing summary.
              sed -n '/█ THRESHOLDS/,$p' k6-bidirectional.log | head -60
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
